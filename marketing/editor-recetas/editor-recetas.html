<style>

@media (max-width: 899px) {

}

<script>
const RAMAS = ['Perder grasa', 'Ganar músculo', 'Mantenimiento'];
const TOMAS = ['Desayuno', 'Media mañana', 'Comida', 'Merienda', 'Cena'];
const CORTO = { 'Desayuno': 'De', 'Media mañana': 'Mm', 'Comida': 'Co', 'Merienda': 'Me', 'Cena': 'Ce' };
const MINIMO_TOMA = 20; // Ninguna toma baja de 20 opciones desde la ampliación de septiembre.
const CLAVE_LOCAL = 'kone_recetario_cambios';

let R = [], RI = {}, ALIM = {}, CLAVES = [], CANT = {}, UNICOS = [];
let C = {};              // cambios guardados, por id de receta
let db = null;
let vista = 'recetas', sel = null, lim = 80, visibles = [];
let F = { q: '', toma: '', obj: '', est: '', tiempo: '', orden: '' };
let ingUI = [], altAbierto = -1, altBusca = '', pelDeshacer = false;
const sucios = new Set(), timers = {}, cola = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
const clonar = (o) => JSON.parse(JSON.stringify(o));

// ─── Macros: la misma cuenta que «Ver macros» de la app (scripts/validar-recetas.js) ───
const PESO_UNIDAD = [
  [/pl[áa]tano/i, 120], [/huevos?\b/i, 55], [/claras?\b/i, 33], [/yemas?\b/i, 17], [/kiwis?\b/i, 75],
  [/manzana|pera\b/i, 180], [/naranja/i, 180], [/aguacate/i, 200], [/tomate/i, 120],
  [/tosta|rebanada|reba[ñn]ada/i, 30], [/panecillo/i, 60], [/tortita|torta de arroz|tortas de arroz/i, 9],
  [/\bbarra\b/i, 100],
  [/panes? wassa|wassa/i, 10], [/barrita/i, 50],
  [/scoop/i, 30], [/cda|cucharada sopera|cucharada\b/i, 15], [/cdta|cucharadita/i, 5],
  [/pu[ñn]ado/i, 25], [/loncha/i, 20], [/yogur/i, 125], [/vaso/i, 200],
  [/latas?\b/i, 80],
  [/zanahorias?/i, 80], [/mandarinas?/i, 90], [/berenjenas?/i, 250],
  [/calabac[íi]n(es)?/i, 200], [/mangos?\b/i, 200], [/boniatos?/i, 150],
  [/pimientos?/i, 120], [/champi[ñn]on(es)?/i, 20], [/rama de apio|ramas de apio/i, 40],
  [/tortillas? (integral|de trigo|de ma[íi]z)/i, 40], [/d[áa]tiles?/i, 8],
  [/higos?\b/i, 50], [/ciruelas?/i, 60], [/melocot[óo]n(es)?/i, 150], [/granadas?/i, 180],
  [/pieza|unidad/i, 100]
];
function buscar(texto) {
  const t = norm(texto.replace(/\(.*?\)/g, '').replace(/\bsin lactosa\b/gi, '').replace(/\bpequeñ[oa]s?\b/gi, '').replace(/\s+/g, ' '));
  const k = CLAVES.find((c) => t.includes(norm(c)));
  return k ? Object.assign({ clave: k }, ALIM[k]) : null;
}
function ponerCantidad(t) {
  if (!t || /^d|^(un|una|medio|media)/i.test(t)) return t;
  const def = CANT[t.toLowerCase()];
  return def ? def + ' ' + t : t;
}
function gramosDeUnidad(texto) {
  const m = texto.trim().match(/^(\d+(?:[.,]\d+)?(?:\/\d+)?)\s+(.*)$/);
  if (!m) return null;
  let n;
  if (m[1].includes('/')) { const [a, b] = m[1].split('/').map(Number); n = b ? a / b : null; }
  else n = parseFloat(m[1].replace(',', '.'));
  if (!n) return null;
  const hit = PESO_UNIDAD.find(([re]) => re.test(m[2]));
  return hit ? { gramos: Math.round(n * hit[1]), resto: m[2] } : null;
}
function leerIng(txt) {
  const t = ponerCantidad(txt.trim());
  let gramos = null, resto = null, unidad = 'g';
  const m = t.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|ml)\b\s*(.+)$/i);
  if (m) { gramos = parseFloat(m[1].replace(',', '.')); resto = m[3]; unidad = /ml/i.test(m[2]) ? 'ml' : 'g'; }
  else { const u = gramosDeUnidad(t); if (u) { gramos = u.gramos; resto = u.resto; } }
  const al = gramos !== null ? buscar(resto) : buscar(t);
  return { t, gramos, unidad, al };
}
function sumar(textos) {
  const r = { kcal: 0, p: 0, c: 0, g: 0, f: 0 };
  textos.forEach((x) => {
    if (!x.trim()) return;
    const i = leerIng(x);
    if (i.gramos === null || !i.al) return;
    const f = i.gramos / 100;
    r.p += i.al.p * f; r.c += i.al.c * f; r.g += i.al.g * f; r.f += (i.al.f || 0) * f;
  });
  const red = (x) => Math.round(Math.round(x * 10) / 10);
  const p = red(r.p), c = red(r.c), g = red(r.g);
  return { kcal: p * 4 + c * 4 + g * 9, p, c, g, f: red(r.f) };
}
const partir = (s) => String(s || '').split(',').map((x) => x.trim()).filter(Boolean);

// ─── Alimentos parecidos ───
const FAMILIAS = [
  ['gluten', /\bpan\b|tosta|pasta|harina|trigo|cusc|bulgur|espelta|centeno|cebada|seit[aá]n|\bwrap|tortilla integral|tortilla de trigo|galleta|granola|cereal|fideo|macarr|espagueti/],
  ['lactosa', /leche(?! de (coco|almendra|soja|avena|arroz))|yogur|queso|skyr|kefir|requeson|cottage|mantequilla|\bnata\b|whey/],
  ['huevo', /huevo|\bclaras?\b/],
  ['pescado', /atun|salmon|merluza|bacalao|sardina|caballa|lubina|dorada|\brape\b|anchoa|trucha|boqueron|pescado|gallo\b/],
  ['marisco', /gamba|langostino|mejillon|calamar|pulpo|sepia|almeja|marisco/],
  ['frutos secos', /\bnuez|nueces|almendra|avellana|anacardo|pistacho|cacahuete|pinones/],
  ['soja', /soja|tofu|edamame|tempeh|tamari/]
];
const familiasDe = (t) => { const n = norm(t); return FAMILIAS.filter(([, re]) => re.test(n)).map(([f]) => f); };

// Dentro de los que cuadran en macros, primero los de su misma familia: atún → otro pescado.
const GRUPOS = [
  ['ave', /pollo|pavo|\bpato\b/], ['pescado', /atun|salmon|merluza|bacalao|sardina|caballa|lubina|dorada|\brape\b|anchoa|trucha|boqueron|pescado|gallo\b|melva|rodaballo|jurel|emperador|bonito/],
  ['marisco', /gamba|langostino|mejillon|calamar|pulpo|sepia|almeja/], ['carne', /ternera|cerdo|lomo|buey|cordero|conejo|carne|jamon|lacon/],

      ${C[r.id] ? `<button class="b" id="deshacer">${pelDeshacer ? '¿Seguro? Pulsa otra vez' : (e.nueva ? 'Descartar receta' : 'Deshacer mis cambios')}</button>` : ''}
    </div>`;
  pintarIngredientes();
}
function cambioIngredientes() {
  const r = RI[sel]; if (!r) return;
  setCampo(sel, 'ingredientes', ingUI.map((x) => x.trim()).filter(Boolean).join(', '));
  $('macrosCaja').innerHTML = htmlMacros(r);
  refrescarFila();
}
function refrescarFila() {
  const f = document.querySelector(`.fila[data-id="${sel}"]`);
  if (f && RI[sel]) { const t = document.createElement('template'); t.innerHTML = htmlFila(RI[sel]).trim(); f.replaceWith(t.content.firstChild); }
}
function siguiente() {
  const i = visibles.findIndex((r) => r.id === sel);
  const sig = visibles.slice(i + 1).find((r) => !estadoDe(r)) || visibles[i + 1];
  if (sig) { if (visibles.indexOf(sig) >= lim) { lim = visibles.indexOf(sig) + 40; pintarLista(); } abrir(sig.id); const f = document.querySelector(`.fila[data-id="${sig.id}"]`); if (f) f.scrollIntoView({ block: 'nearest' }); }
  else { sel = null; pintarFicha(); brindis('Ya no quedan más en esta lista'); }
}
function brindis(t) { const b = $('brindis'); b.textContent = t; b.hidden = false; clearTimeout(brindis._t); brindis._t = setTimeout(() => { b.hidden = true; }, 2200); }

// ─── Recuento ───
function cuenta(rama, toma) { const k = rama + '|' + toma; return R.filter((r) => !ef(r).quitar && ef(r).mx.includes(k)).length; }
function cuentaBase(rama, toma) { const k = rama + '|' + toma; return R.filter((r) => !C[r.id]?.nueva && baseMx(r).includes(k)).length; }
function pintarRecuento() {
  const tipos = [['pendiente', 'sin revisar'], ['macros', 'con macros que no cuadran'], ['parecida', 'casi iguales a otra'], ['variantes', 'con nombre repetido'], ['criterio', 'batidos con canela'], ['fav', 'favoritas']];
  const cuantas = (t) => R.filter((r) => { if (t === 'pendiente') return !estadoDe(r); if (t === 'fav') return ef(r).fav; return r.avisos.some((a) => a.t === t); }).length;
  $('vista').innerHTML = `<div class="pagina"><div class="ancho">
    <h2>Cuántas opciones quedan</h2>
    <p>Lo que tendría cada objetivo en cada toma con tus cambios. En rojo si baja de ${MINIMO_TOMA}: por debajo se empiezan a repetir platos y los filtros de alergias o «no como» se quedan cortos. Pulsa una casilla para ver esas recetas.</p>
    <div style="overflow-x:auto"><table class="rec"><thead><tr><th></th>${TOMAS.map((t) => `<th scope="col">${t}</th>`).join('')}</tr></thead><tbody>
    ${RAMAS.map((ra) => `<tr><th scope="row" style="white-space:nowrap">${ra}</th>${TOMAS.map((t) => { const n = cuenta(ra, t), b = cuentaBase(ra, t); return `<td><button class="${n < MINIMO_TOMA ? 'corta' : ''}" data-ir-obj="${esc(ra)}" data-ir-toma="${esc(t)}"><b>${n}</b><small>${n === b ? 'igual' : 'antes ' + b}</small></button></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <h2 style="margin-top:26px">Por dónde empezar</h2>
    <p>Los avisos salen de medir las ${R.length} recetas con la tabla de alimentos de la app. Pulsa para ir a ellas.</p>
    <div class="resumen-n">${tipos.map(([t, x]) => `<button data-ir-est="${t}"><b>${cuantas(t)}</b>${x}</button>`).join('')}</div>
  </div></div>`;
}

// ─── Tus cambios ───
function filasCambio(r) {
  const c = C[r.id] || {}, d = [];
  const par = (n, a, b) => d.push([n, `<s>${esc(a)}</s><span class="a">→</span>${esc(b)}`]);
  if (c.nueva) { d.push(['Ingredientes', esc(c.ingredientes || '')]); d.push(['Dónde', esc((c.ap || []).join(', ').replace(/\|/g, ' · ') || 'Sin toma elegida')]); }
  else {
    if (c.nombre != null) par('Nombre', r.nombre, c.nombre);
    if (c.ingredientes != null) { par('Ingredientes', r.ingredientes, c.ingredientes); const a = r.calc, b = sumar(partir(c.ingredientes)); par('Macros', `${a.kcal} kcal, ${a.p} P, ${a.c} C, ${a.g} G`, `${b.kcal} kcal, ${b.p} P, ${b.c} C, ${b.g} G`); }
    if (c.prep != null) par('Tiempo', r.prep, c.prep);
    if (c.ap != null) {
      const bs = baseMx(r), sale = bs.filter((x) => !c.ap.includes(x)), entra = c.ap.filter((x) => !bs.includes(x));
      if (sale.length) d.push(['Sale de', esc(sale.join(', ').replace(/\|/g, ' · '))]);
      if (entra.length) d.push(['Entra en', esc(entra.join(', ').replace(/\|/g, ' · '))]);
    }
  }
  if (c.nota) d.push(['Nota', esc(c.nota)]);
  return d;
}
function pintarCambios() {
  const lista = R.filter((r) => C[r.id]);
  const grupos = [
    ['Para quitar', lista.filter((r) => C[r.id].estado === 'quitar')],
    ['Recetas nuevas', lista.filter((r) => C[r.id].nueva && C[r.id].estado !== 'quitar')],
    ['Cambiadas', lista.filter((r) => !C[r.id].nueva && C[r.id].estado !== 'quitar' && editada(C[r.id]))],
    ['Con nota', lista.filter((r) => C[r.id].nota && !editada(C[r.id]) && C[r.id].estado !== 'quitar')],
    ['Favoritas', lista.filter((r) => C[r.id].fav)]
  ].filter(([, l]) => l.length);
  const cuerpo = grupos.map(([t, l]) => `<section class="grupo"><h3>${t} (${l.length})</h3>${l.map((r) => {
    const d = t === 'Favoritas' ? [] : filasCambio(r);
    return `<div class="cam"><button class="cam-nom" data-abrir="${r.id}">${esc(ef(r).nombre)}</button>${d.length ? `<dl class="dif">${d.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>` : ''}</div>`;
  }).join('')}</section>`).join('');
  $('vista').innerHTML = `<div class="pagina"><div class="ancho">
    <h2>Antes y después</h2>
    <p>La app sigue igual hasta que le digas a Claude «aplica los cambios». Entonces recalcula los macros, pasa las auditorías de alimentos y alérgenos y lo sube. Si una receta sale en varios objetivos, el cambio vale para todos.</p>
    <div class="pie-botones"><button class="b-peq" id="copiar">Copiar el resumen</button></div>
    ${cuerpo || '<p>Todavía no has cambiado nada. Cuando edites una receta, aparecerá aquí.</p>'}
  </div></div>`;
}
function textoResumen() {
  return JSON.stringify(R.filter((r) => C[r.id]).map((r) => Object.assign({ id: r.id, original: r.nombre }, C[r.id])), null, 1);
}

// ─── Vistas y eventos ───
function irA(v) {
  vista = v;
  document.querySelectorAll('.pest button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.vista === v)));
  if (v === 'recetas') pintarBanco(); else if (v === 'recuento') pintarRecuento(); else pintarCambios();
}
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.vista) return irA(t.dataset.vista);
  if (t.dataset.irObj || t.dataset.irEst) {
    F = { q: '', toma: t.dataset.irToma || '', obj: t.dataset.irObj || '', est: t.dataset.irEst || '', tiempo: '', orden: '' }; lim = 80; sel = null;
    return irA('recetas');
  }
  if (t.dataset.abrir) { const id = t.dataset.abrir; F = { q: '', toma: '', obj: '', est: '', tiempo: '', orden: '' }; irA('recetas'); return abrir(id); }
  if (t.id === 'verMas') { lim += 100; return pintarLista(); }
  if (t.id === 'copiar') {
    const txt = textoResumen();
    navigator.clipboard.writeText(txt).then(() => brindis('Resumen copiado'), () => { const a = document.createElement('textarea'); a.className = 'campo'; a.value = txt; t.parentElement.after(a); a.select(); brindis('Selecciónalo y cópialo a mano'); });
    return;
  }
  if (t.id === 'nueva') {
    const id = 'n' + Date.now();
    C[id] = { nueva: true, nombre: 'Receta nueva', ingredientes: '', prep: 'Fácil · 10 min', ap: [], ts: Date.now() };
    sincronizarNuevas(); programar(id); pintarCabecera(); pintarLista(); ingUI = ['']; sel = id; altAbierto = -1; pintarFicha();
    return;
  }
  if (t.classList.contains('fila') || t.classList.contains('vinculo')) return abrir(t.dataset.id);
  if (t.id === 'volver') { sel = null; return pintarFicha(); }
  if (!sel || !RI[sel]) return;
  if (t.dataset.mx) {
    const e = ef(RI[sel]); const k = t.dataset.mx;
    const nueva = e.mx.includes(k) ? e.mx.filter((x) => x !== k) : e.mx.concat(k);
    setCampo(sel, 'ap', nueva);
    t.setAttribute('aria-pressed', String(nueva.includes(k)));
    return refrescarFila();
  }
  if (t.dataset.alts != null) { const k = +t.dataset.alts; altAbierto = altAbierto === k ? -1 : k; altBusca = ''; return pintarIngredientes(); }
  if (t.dataset.qing != null) { ingUI.splice(+t.dataset.qing, 1); altAbierto = -1; pintarIngredientes(); return cambioIngredientes(); }
  if (t.dataset.alt) { ingUI[altAbierto] = t.dataset.alt; altAbierto = -1; altBusca = ''; pintarIngredientes(); cambioIngredientes(); return brindis('Ingrediente cambiado'); }
  if (t.id === 'addIng') { ingUI.push(''); altAbierto = -1; pintarIngredientes(); const u = $('ing-' + (ingUI.length - 1)); if (u) u.focus(); return; }
  const c = Object.assign({}, C[sel] || {});
  if (t.id === 'bien') { if (c.estado === 'quitar' || !c.estado) c.estado = 'ok'; ponerDoc(sel, c); refrescarFila(); return siguiente(); }
  if (t.id === 'fav') { if (c.fav) delete c.fav; else c.fav = true; ponerDoc(sel, c); refrescarFila(); return pintarFicha(); }
  if (t.id === 'quitar') { if (c.estado === 'quitar') delete c.estado; else c.estado = 'quitar'; ponerDoc(sel, c); refrescarFila(); return pintarFicha(); }
  if (t.id === 'deshacer') {
    if (!pelDeshacer) { pelDeshacer = true; t.textContent = '¿Seguro? Pulsa otra vez'; return; }
    const id = sel; const eraNueva = !!(C[id] && C[id].nueva);
    delete C[id]; programar(id); pintarCabecera();
    if (eraNueva) { sincronizarNuevas(); sel = null; pintarLista(); return pintarFicha(); }
    refrescarFila(); return abrir(id);
  }
});
let tBusca;
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.id === 'fQ') { F.q = t.value; lim = 80; clearTimeout(tBusca); tBusca = setTimeout(pintarLista, 130); return; }
  if (t.id === 'altQ') {
    altBusca = t.value; const v = t.value; pintarIngredientes(); const n = $('altQ'); if (n) { n.focus(); n.setSelectionRange(v.length, v.length); }
    return;
  }
  if (!sel || !RI[sel]) return;
  if (t.id === 'nombre') { setCampo(sel, 'nombre', t.value); return refrescarFila(); }
  if (t.id === 'prep') { setCampo(sel, 'prep', t.value); return; }
  if (t.id === 'nota') { const c = Object.assign({}, C[sel] || {}); if (t.value.trim()) c.nota = t.value; else delete c.nota; ponerDoc(sel, c); return; }
  if (t.id.startsWith('ing-')) { const k = +t.id.slice(4); ingUI[k] = t.value; const i = $('info-' + k); if (i) i.innerHTML = infoIng(t.value); return cambioIngredientes(); }
});
document.addEventListener('change', (ev) => {
  const m = { fToma: 'toma', fObj: 'obj', fEst: 'est', fTiempo: 'tiempo', fOrden: 'orden' }[ev.target.id];
  if (m) { F[m] = ev.target.value; lim = 80; pintarLista(); }
});

// Las recetas nuevas viven solo en los cambios: se añaden a la lista como una fila más.
function sincronizarNuevas() {
  R = R.filter((r) => !r.esNueva || C[r.id]);
  Object.keys(C).forEach((id) => {
    if (C[id].nueva && !RI[id]) { const f = { id, esNueva: true, nombre: C[id].nombre, ingredientes: '', prep: '', et: {}, calc: { kcal: 0, p: 0, c: 0, g: 0 }, fija: false, ap: [], avisos: [] }; R.unshift(f); RI[id] = f; }
  });
}

// ─── Arranque ───
(async function () {
  try {
    const [recetas, alim] = await Promise.all([fetch('recetas.json').then((r) => r.json()), fetch('alimentos.json').then((r) => r.json())]);
    R = recetas; R.forEach((r) => { RI[r.id] = r; });
    ALIM = alim.alim; CANT = alim.cant; CLAVES = Object.keys(ALIM).sort((a, b) => b.length - a.length);
    prepararAlimentos();
  } catch (e) {
    $('avanceTxt').textContent = 'No se han podido cargar las recetas. Recarga la página.';
    return;
  }
  try { C = JSON.parse(localStorage.getItem(CLAVE_LOCAL) || '{}') || {}; } catch (e) { C = {}; }
  sincronizarNuevas();
  pintarCabecera();
  irA('recetas');

  db = window.claude && window.claude.use ? await window.claude.use('db').catch(() => null) : null;
  if (!db) {
    const a = $('avisoRed'); a.hidden = false;
    a.textContent = 'Aquí los cambios solo se guardan en este navegador. Abre la página desde tu cuenta de Claude para que queden guardados y yo pueda leerlos.';
    indicador('Solo en este navegador');
    return;
  }
  let reloj = setTimeout(() => { const a = $('avisoRed'); a.hidden = false; a.textContent = 'Todavía no llego a tus cambios guardados. Lo que edites se guarda en cuanto vuelva la conexión.'; }, 10000);
  db.collection('cambios').onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(reloj); $('avisoRed').hidden = true; }
    const nuevo = {};
    snap.docs.forEach((d) => { nuevo[d.id] = clonar(d.data()); });
    sucios.forEach((id) => { if (C[id]) nuevo[id] = C[id]; else delete nuevo[id]; });
    const antes = JSON.stringify(C[sel] || null);
    C = nuevo;
    guardarLocal();
    sincronizarNuevas();
    pintarCabecera();
    if (vista === 'recetas') {
      pintarLista();
      const dentro = document.activeElement && document.activeElement.closest && document.activeElement.closest('#ficha');
      if (!dentro && JSON.stringify(C[sel] || null) !== antes) { if (RI[sel]) { ingUI = partir(ef(RI[sel]).ingredientes); } pintarFicha(); }
    }
  }, () => { clearTimeout(reloj); const a = $('avisoRed'); a.hidden = false; a.textContent = 'Se ha cortado la conexión con tus cambios guardados. Recarga la página.'; });
})();
</script>

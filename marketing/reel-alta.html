<!doctype html>
<!--
  K-ONE · Reel "Cómo darse de alta" — 1080x1920.

  Explica el alta y los seis bloques del cuestionario. Las capturas son de la
  app REAL, hechas con cdp-shot.mjs + estado-demo-alta.js.

  IMPORTANTE: ese script NO registra ninguna cuenta. index.html apunta a la
  Supabase de producción, así que enviar el formulario crearía un cliente falso
  de verdad. Solo se rellenan los campos y se navega entre bloques.

  El motor de dibujo está en reel-motor.js, compartido con reel-hoy.html: aquí
  solo va la lista de bloques.

  Render:
    node cdp-frames.mjs "http://localhost:8080/marketing/reel-alta.html" <dir> 33 25 1080 1920
-->
<meta charset="utf-8">
<title>K-ONE · Reel del alta</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');
  html,body{margin:0;padding:0;width:1080px;height:1920px;background:#000;overflow:hidden}
  canvas{display:block}
</style>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<!-- Nodos reales que fuerzan la descarga de las webfonts: un canvas por sí solo
     NO la dispara. -->

<span style="position:fixed;top:-400px;font-family:'Inter';font-size:40px">K-ONE</span>

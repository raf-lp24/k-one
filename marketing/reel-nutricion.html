<!doctype html>
<!--
  K-ONE · Reel "Cómo funciona la nutrición" — 1080x1920.

  Las capturas de la app son REALES (cdp-shot.mjs + estado-demo-nutricion.js,
  con un cliente inventado). Los dos planos de vídeo — el plato y el carrito de
  la compra — son de Higgsfield (kling3_0_turbo, 7,5 créditos cada uno) y se
  montan aparte con ffmpeg, no desde aquí: este archivo solo dibuja los bloques
  de app y los rótulos.

  El motor de dibujo está en reel-motor.js, compartido con los otros reels.

  Render:
    node cdp-frames.mjs "http://localhost:8080/marketing/reel-nutricion.html" <dir> 30 25 1080 1920
-->

  canvas{display:block}
</style>

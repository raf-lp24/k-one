<!doctype html>
<!--
  Piezas del reel del modo entrenamiento (1080x1920). Cada una se renderiza a PNG
  con cdp-frames.mjs (fondo transparente donde no hay nada):
    ?pieza=fondo · ?pieza=marco · ?pieza=mascara · ?pieza=texto&i=0..8 · ?pieza=final
  El montaje lo hace marketing/montar-reel-entreno.sh.
-->
<meta charset="utf-8">
<title>K-ONE · piezas del reel</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: transparent; overflow: hidden; color: #F0EDE8; font-family: 'Inter', sans-serif; }
  .p { position: absolute; inset: 0; display: none; }
  /* Pantalla del móvil: 610x1320 en (235,450). Marco 14 px alrededor. */
  .fondo { background: #0A0A0A; }
  .fondo::before { content: ''; position: absolute; width: 1100px; height: 1100px; right: -420px; top: -380px; border-radius: 50%; background: radial-gradient(circle, rgba(209,66,14,.38), transparent 62%); }
  .fondo::after { content: ''; position: absolute; width: 900px; height: 900px; left: -420px; bottom: -300px; border-radius: 50%; background: radial-gradient(circle, rgba(209,66,14,.22), transparent 62%); }
  .rejilla { position: absolute; inset: 0; opacity: .06; background-image: linear-gradient(rgba(255,255,255,.7) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.7) 1px, transparent 1px); background-size: 90px 90px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 60%); mask-image: linear-gradient(180deg, #000, transparent 60%); }
  .logo { position: absolute; left: 72px; top: 70px; font-family: 'Bebas Neue', sans-serif; font-size: 58px; letter-spacing: 3px; }
  .logo span, .naranja { color: #F26A36; }
  .pie { position: absolute; left: 0; right: 0; bottom: 52px; text-align: center; font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: rgba(240,237,232,.75); }
  .pie b { color: #F26A36; font-weight: 500; }
  .marco { }
  .cuerpo { position: absolute; left: 221px; top: 436px; width: 638px; height: 1348px; border-radius: 68px; border: 14px solid #161616; box-shadow: 0 0 0 2px #2c2c2c, 0 40px 120px rgba(0,0,0,.8), 0 0 80px rgba(209,66,14,.18); }
  .mascara { background: #000; }
  .mascara i { position: absolute; left: 235px; top: 450px; width: 610px; height: 1320px; border-radius: 54px; background: #fff; }
  .texto { }
  .caja { position: absolute; left: 72px; right: 72px; top: 170px; }
  .eye { display: inline-flex; align-items: center; gap: 12px; font-family: 'DM Mono', monospace; font-size: 22px; letter-spacing: 4px; text-transform: uppercase; color: #F26A36; background: rgba(209,66,14,.12); border: 1.5px solid rgba(242,106,54,.5); border-radius: 999px; padding: 9px 20px; }
  .eye::before { content: ''; width: 11px; height: 11px; border-radius: 50%; background: #F26A36; box-shadow: 0 0 10px #F26A36; }
  .tit { font-family: 'Bebas Neue', sans-serif; font-size: 96px; line-height: .95; letter-spacing: 1px; margin-top: 18px; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .final { background: #0A0A0A; display: none; }
  .final .centro { position: absolute; left: 0; right: 0; top: 640px; text-align: center; }
  .final .big { font-family: 'Bebas Neue', sans-serif; font-size: 190px; letter-spacing: 6px; line-height: 1; }
  .final .lema { font-family: 'DM Mono', monospace; font-size: 26px; letter-spacing: 6px; color: rgba(240,237,232,.75); margin-top: 18px; }
  .final .oferta { display: inline-block; margin-top: 80px; font-family: 'Bebas Neue', sans-serif; font-size: 82px; line-height: 1; }
  .final .cta { display: inline-block; margin-top: 50px; background: #D1420E; color: #fff; font-family: 'Bebas Neue', sans-serif; font-size: 60px; letter-spacing: 3px; padding: 22px 56px 16px; border-radius: 999px; box-shadow: 0 20px 60px rgba(209,66,14,.5); }
</style>
<body>
<div class="p fondo" id="fondo"><div class="rejilla"></div><div class="logo">K-<span>ONE</span></div><div class="pie">k-one.fit · <b>primer mes gratis, sin tarjeta</b></div></div>
<div class="p marco" id="marco"><div class="cuerpo"></div></div>
<div class="p mascara" id="mascara"><i></i></div>
<div class="p texto" id="texto"><div class="caja"><div class="eye" id="eye"></div><div class="tit" id="tit"></div></div></div>
<div class="p final" id="final"><div class="fondo" style="position:absolute;inset:0"></div><div class="rejilla"></div>
  <div class="centro"><div class="big">K-<span class="naranja">ONE</span></div><div class="lema">ENTRENAMIENTO · NUTRICIÓN · SEGUIMIENTO</div>
  <div class="oferta">Primer mes <span class="naranja">gratis</span><br>y sin tarjeta</div><br><div class="cta">k-one.fit</div></div></div>
<script>
  const TEXTOS = [
    ['Tu área en K-ONE', 'Tu día en<br>una pantalla'],
    ['Comida', 'Marca tus<br>comidas de hoy'],
    ['Entrenamiento', 'Pulsa y<br>te guiamos'],
    ['Progresión', 'Te decimos qué<br>peso poner'],
    ['Serie a serie', 'Marca la serie.<br>El descanso va solo'],
    ['Autorregulación', 'Dinos cómo<br>te ha ido'],
    ['Paso a paso', 'Ejercicio a<br>ejercicio'],
    ['Al terminar', 'Tus kilos y<br>tus récords'],
    ['Constancia', 'Y tu racha<br>sigue creciendo']
  ];
  const q = new URLSearchParams(location.search);
  const pieza = q.get('pieza') || 'fondo';
  if (pieza === 'texto') { const t = TEXTOS[+q.get('i') || 0]; document.getElementById('eye').textContent = t[0]; document.getElementById('tit').innerHTML = t[1]; }
  document.getElementById(pieza).style.display = 'block';
  window.render = () => {};
  window.listo = document.fonts.ready.then(() => document.fonts.load("96px 'Bebas Neue'")).then(() => new Promise(r => setTimeout(r, 300)));
</script>
</body>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>K-ONE · Vídeo TikTok: LA FINAL España vs Argentina (2 meses gratis)</title>
<style>
  body { background:#000; color:#ccc; font-family:'Segoe UI',Arial,sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px; margin:0; min-height:100vh; justify-content:center; }
  canvas { height:min(72vh,720px); aspect-ratio:9/16; border-radius:10px; box-shadow:0 0 50px rgba(232,73,15,.2); background:#0b0b0b; }
  .btns { display:flex; gap:10px; }
  button { background:#E8490F; color:#fff; border:0; border-radius:8px; padding:13px 30px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
  button.sec { background:#222; }
  button:disabled { opacity:.4; cursor:default; }
  #status { font-size:14px; color:#888; min-height:20px; text-align:center; max-width:460px; line-height:1.5; }
  a.dl { color:#E8490F; font-weight:700; }
</style>
</head>
<body>

<canvas id="cv" width="1080" height="1920"></canvas>
<div class="btns">
  <button id="gen">🎬 GENERAR VÍDEO (30s)</button>
  <button class="sec" id="prev">Solo ver</button>
</div>
<div id="status">Pulsa <b>Generar vídeo</b>: se reproduce una vez y al acabar se descarga el archivo listo para TikTok (1080×1920). No cambies de pestaña mientras graba.</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const TOTAL = 30;

const COL = {
  naranja:'#E8490F', negro:'#0b0b0b', grafito:'#141414', carbon:'#1E1E1E',
  hueso:'#F0EDE8', metal:'#b5b2ad', borde:'#2a2a2a', verde:'#27ae60', oro:'#E8C547',
  espRojo:'#AA151B', espAmarillo:'#F1BF00', argCeleste:'#74ACDF', argSol:'#F6B40E'
};
const FONT = '"Segoe UI", Arial, sans-serif';
const MONO = 'Consolas, "Courier New", monospace';
const N = COL.naranja, M = COL.metal, B = '#fff', V = COL.verde, ORO = COL.oro;

/* ---------- helpers ---------- */
const clamp = (x,a,b) => Math.max(a, Math.min(b,x));
const easeOut = x => 1 - Math.pow(1-x,3);
function popE(x){ const c = 1.70158; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); }
function up(tl, d, dur=0.55){ const x = clamp((tl-d)/dur, 0, 1); return { a:x, dy:40*(1-easeOut(x)) }; }
function pop(tl, d, dur=0.5){ const x = clamp((tl-d)/dur, 0, 1); return { a:clamp(x*2,0,1), s: x===0 ? .6 : .6+.4*popE(x) }; }

function setFont(size, weight='400', mono=false, ls=0){
  ctx.font = `${weight} ${size}px ${mono?MONO:FONT}`;
  ctx.letterSpacing = ls + 'px';
}
function txt(str, x, y, size, {w='400', col:c='#fff', align='center', mono=false, ls=0, a=1} = {}){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, w, mono, ls);
  ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rich(segs, cx, y, size, weight='900', a=1, dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, weight);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tot = segs.reduce((s,seg)=> s + ctx.measureText(seg.t).width, 0);
  let x = cx - tot/2;
  for (const seg of segs){
    ctx.fillStyle = seg.c || '#fff';
    ctx.fillText(seg.t, x, y + dy);
    x += ctx.measureText(seg.t).width;
  }
  ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function card(x,y,w,h,a=1,dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y+dy, w, h, 22);
  ctx.fillStyle = 'rgba(20,20,20,0.92)'; ctx.fill();
  ctx.strokeStyle = COL.borde; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function logoK(cx, y, size, a=1, s=1){
  ctx.save(); ctx.globalAlpha *= a;
  ctx.translate(cx,y); ctx.scale(s,s); ctx.translate(-cx,-y);
  setFont(size,'900',false,6);
  ctx.textBaseline='middle'; ctx.textAlign='left';
  const w1 = ctx.measureText('K-').width, w2 = ctx.measureText('ONE').width;
  let x = cx-(w1+w2)/2;
  ctx.fillStyle='#fff'; ctx.fillText('K-',x,y);
  ctx.fillStyle=N; ctx.fillText('ONE',x+w1,y);
  ctx.restore();
}

/* ============ AMBIENTE DE ESTADIO ============ */
/* público: puntos deterministas en la mitad superior, algunos hacen flash de cámara */
const CROWD = [];
(function(){
  let s = 7;
  const rnd = () => { s = (s*1103515245+12345) % 2147483648; return s/2147483648; };
  for (let i=0;i<520;i++){
    CROWD.push({ x:rnd()*W, y:120+rnd()*520, sz:2+rnd()*3.2, ph:rnd()*6.28, fl:rnd()<0.16, tint:rnd() });
  }
})();
function estadio(t, k=1){
  // cielo/graderío
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#06070c'); g.addColorStop(0.42, '#0d0f16'); g.addColorStop(0.62, '#0a0a0a'); g.addColorStop(1, '#0b0b0b');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  ctx.save(); ctx.globalAlpha = k;
  // banda de graderío (dos niveles con línea)
  ctx.fillStyle = 'rgba(22,25,34,0.9)'; ctx.fillRect(0, 120, W, 540);
  ctx.fillStyle = 'rgba(10,12,18,0.9)'; ctx.fillRect(0, 380, W, 14);
  // público
  CROWD.forEach(p=>{
    const tw = 0.35 + 0.3*Math.sin(t*1.4+p.ph);
    ctx.fillStyle = p.tint<0.33 ? `rgba(120,130,150,${tw})` : p.tint<0.66 ? `rgba(90,95,110,${tw})` : `rgba(150,140,120,${tw})`;
    ctx.fillRect(p.x, p.y, p.sz, p.sz);
    // flashes de cámaras
    if (p.fl && Math.sin(t*2.1 + p.ph*7) > 0.985){
      ctx.save();
      ctx.shadowColor = '#fff'; ctx.shadowBlur = 22;
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  });
  // focos: cuatro conos volumétricos desde arriba
  [[90,-40,1],[W-90,-40,-1],[330,-60,0.5],[W-330,-60,-0.5]].forEach(([fx,fy,dir])=>{
    const lg = ctx.createLinearGradient(fx, fy, fx+dir*300, 900);
    lg.addColorStop(0, 'rgba(220,230,255,0.16)');
    lg.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + dir*430 - 150, 940);
    ctx.lineTo(fx + dir*430 + 150, 940);
    ctx.closePath(); ctx.fill();
  });
  // césped abajo con franjas
  const gr = ctx.createLinearGradient(0, H-420, 0, H);
  gr.addColorStop(0, 'rgba(20,60,30,0.55)'); gr.addColorStop(1, 'rgba(8,26,13,0.9)');
  ctx.fillStyle = gr; ctx.fillRect(0, H-420, W, 420);
  for (let i=0;i<6;i++){
    ctx.fillStyle = i%2 ? 'rgba(255,255,255,0.022)' : 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, H-420 + i*70, W, 70);
  }
  // línea de banda
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-40, H-330); ctx.quadraticCurveTo(W/2, H-390, W+40, H-330); ctx.stroke();
  ctx.restore();

  // viñeta
  const v = ctx.createRadialGradient(W/2, H*0.45, 300, W/2, H*0.5, 1200);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

/* ============ BANDERAS ONDEANDO ============ */
/* dibuja la bandera en rebanadas verticales con onda senoidal */
function flagWave(x, y, w, h, t, bands, sunAt){
  const SL = 42;
  for (let i=0;i<SL;i++){
    const fx = i/SL;
    const dy = Math.sin(fx*4.2 + t*3.1) * h*0.055 * (0.35+fx);
    const sx = x + fx*w, sw = w/SL + 1;
    let by = y + dy;
    for (const [frac, col] of bands){
      ctx.fillStyle = col;
      ctx.fillRect(sx, by, sw, h*frac);
      by += h*frac;
    }
    // sombra ondulada para volumen
    const sh = 0.10 + 0.10*Math.sin(fx*4.2 + t*3.1 + 1.4);
    ctx.fillStyle = `rgba(0,0,0,${clamp(sh,0,0.2)})`;
    ctx.fillRect(sx, y+dy, sw, h);
  }
  // sol de Argentina (encima, siguiendo la onda del centro)
  if (sunAt){
    const fx = 0.5;
    const dy = Math.sin(fx*4.2 + t*3.1) * h*0.055 * (0.35+fx);
    const cxx = x + w/2, cyy = y + h/2 + dy;
    ctx.save();
    ctx.fillStyle = COL.argSol;
    ctx.beginPath(); ctx.arc(cxx, cyy, h*0.115, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = COL.argSol; ctx.lineWidth = 2.6;
    for (let r=0;r<16;r++){
      const an = r/16*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cxx + Math.cos(an)*h*0.135, cyy + Math.sin(an)*h*0.135);
      ctx.lineTo(cxx + Math.cos(an)*h*0.185, cyy + Math.sin(an)*h*0.185);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function banderaEsp(x,y,w,h,t,a=1){
  ctx.save(); ctx.globalAlpha *= a;
  flagWave(x,y,w,h,t, [[0.25,COL.espRojo],[0.5,COL.espAmarillo],[0.25,COL.espRojo]]);
  ctx.restore();
}
function banderaArg(x,y,w,h,t,a=1){
  ctx.save(); ctx.globalAlpha *= a;
  flagWave(x,y,w,h,t, [[0.3333,COL.argCeleste],[0.3334,'#ffffff'],[0.3333,COL.argCeleste]], true);
  ctx.restore();
}
/* mini banderas planas para el marcador */
function miniEsp(x,y,w,h){
  rrect(x,y,w,h,8); ctx.save(); ctx.clip();
  ctx.fillStyle=COL.espRojo; ctx.fillRect(x,y,w,h/4);
  ctx.fillStyle=COL.espAmarillo; ctx.fillRect(x,y+h/4,w,h/2);
  ctx.fillStyle=COL.espRojo; ctx.fillRect(x,y+3*h/4,w,h/4);
  ctx.restore();
}
function miniArg(x,y,w,h){
  rrect(x,y,w,h,8); ctx.save(); ctx.clip();
  ctx.fillStyle=COL.argCeleste; ctx.fillRect(x,y,w,h/3);
  ctx.fillStyle='#fff'; ctx.fillRect(x,y+h/3,w,h/3);
  ctx.fillStyle=COL.argCeleste; ctx.fillRect(x,y+2*h/3,w,h/3);
  ctx.fillStyle=COL.argSol; ctx.beginPath(); ctx.arc(x+w/2,y+h/2,h*0.13,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* marcador estilo retransmisión */
function scoreboard(cx, y, t, a=1, dy=0, scoreTxt='? - ?'){
  ctx.save(); ctx.globalAlpha *= a;
  const w = 780, h = 150;
  const x = cx - w/2;
  // cuerpo de cristal oscuro
  rrect(x, y+dy, w, h, 20);
  const gg = ctx.createLinearGradient(0, y+dy, 0, y+dy+h);
  gg.addColorStop(0,'rgba(30,32,40,0.96)'); gg.addColorStop(1,'rgba(12,13,17,0.96)');
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 2; ctx.stroke();
  // etiqueta FINAL dorada
  rrect(cx-92, y+dy-26, 184, 52, 12);
  ctx.fillStyle = ORO; ctx.fill();
  txt('FINAL', cx, y+dy, 30, {w:'900', col:'#171204', ls:4});
  // banderas + siglas
  miniEsp(x+46, y+dy+48, 96, 62);
  txt('ESP', x+196, y+dy+80, 44, {w:'900', mono:true});
  miniArg(x+w-46-96, y+dy+48, 96, 62);
  txt('ARG', x+w-196, y+dy+80, 44, {w:'900', mono:true});
  // marcador pulsante
  const pk = 1 + Math.sin(t*4)*0.08;
  ctx.save(); ctx.translate(cx, y+dy+80); ctx.scale(pk,pk);
  ctx.shadowColor='rgba(232,73,15,.6)'; ctx.shadowBlur=34;
  txt(scoreTxt, 0, 0, 66, {col:N, w:'900', mono:true});
  ctx.restore();
  ctx.restore();
}

/* confeti determinista */
const CONF = [];
(function(){
  let s = 42;
  const rnd = () => { s = (s*1103515245+12345) % 2147483648; return s/2147483648; };
  for (let i=0;i<110;i++) CONF.push({ x:rnd()*W, v:250+rnd()*350, ph:rnd()*6.28, sz:8+rnd()*12,
    c:[N,COL.espRojo,COL.espAmarillo,'#fff',COL.argCeleste,ORO][Math.floor(rnd()*6)] });
})();
function confeti(tl, a=1){
  ctx.save(); ctx.globalAlpha *= a;
  CONF.forEach(p => {
    const y = (p.ph*300 + tl*p.v) % (H+80) - 40;
    const x = p.x + Math.sin(tl*2.4 + p.ph)*38;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tl*3+p.ph);
    ctx.fillStyle = p.c; ctx.fillRect(-p.sz/2, -p.sz/4, p.sz, p.sz/2);
    ctx.restore();
  });
  ctx.restore();
}

/* ---------- timeline ----------
   s1 0     estadio: ESPAÑA vs ARGENTINA, banderas ondeando
   s2 3.6   marcador broadcast ?-?
   s3 7.2   cómo participar (3 pasos)
   s4 13.6  qué es K-ONE
   s5 18.2  EL PREMIO: 2 MESES + confeti
   s6 23    reglas
   s7 26.2  CTA final
--------------------------------- */
const T = { s1:0, s2:3.6, s3:7.2, s4:13.6, s5:18.2, s6:23, s7:26.2 };

function s1(tl, t){
  estadio(t, 1);
  // pequeña sacudida de cámara al principio
  const shake = clamp(1-tl/0.8,0,1);
  ctx.save();
  ctx.translate(Math.sin(tl*38)*4*shake, Math.cos(tl*31)*3*shake);
  const fa = tl<0.2 ? tl/0.2 : clamp(1-(tl-0.2)/0.3,0,1);
  ctx.fillStyle = `rgba(255,255,255,${0.18*fa})`; ctx.fillRect(0,0,W,H);

  txt('MUNDIAL 2026', W/2, 300+up(tl,0).dy, 34, {col:ORO, w:'700', mono:true, ls:10, a:up(tl,0).a});
  const p = pop(tl, 0.2, 0.5);
  ctx.save(); ctx.globalAlpha = p.a;
  ctx.translate(W/2, 430); ctx.scale(p.s, p.s);
  ctx.shadowColor='rgba(232,197,71,.45)'; ctx.shadowBlur=50;
  txt('LA GRAN FINAL', 0, 0, 96, {w:'900'});
  ctx.restore();

  // banderas ondeando entran de los lados
  const kE = easeOut(clamp((tl-0.45)/0.55,0,1));
  const kA = easeOut(clamp((tl-0.65)/0.55,0,1));
  const bw = 360, bh = 240;
  banderaEsp(-bw + kE*(130+bw), 620, bw, bh, t, kE);
  banderaArg(W - kA*(130+bw), 620, bw, bh, t, kA);
  txt('ESPAÑA', 130+bw/2, 950, 48, {w:'900', a:kE});
  txt('ARGENTINA', W-130-bw/2, 950, 48, {w:'900', a:kA});

  const pv = pop(tl, 1.15, 0.45);
  ctx.save(); ctx.globalAlpha = pv.a;
  ctx.translate(W/2, 750); ctx.scale(pv.s, pv.s);
  ctx.shadowColor='rgba(232,73,15,.7)'; ctx.shadowBlur=70;
  txt('VS', 0, 0, 140, {col:N, w:'900'});
  ctx.restore();

  const u = up(tl, 1.7);
  rich([{t:'Y tú te juegas ',c:B},{t:'2 MESES GRATIS',c:N}], W/2, 1140, 58, '900', u.a, u.dy);
  txt('de entrenador personal digital 👇', W/2, 1230+up(tl,2.1).dy, 42, {col:M, w:'600', a:up(tl,2.1).a});
  ctx.restore();
}

function s2(tl, t){
  estadio(t, 0.8);
  txt('SORTEO', W/2, 380+up(tl,0).dy, 34, {col:N, w:'700', mono:true, ls:8, a:up(tl,0).a});
  rich([{t:'Acierta el ',c:B},{t:'resultado exacto',c:N}], W/2, 490, 58, '900', up(tl,0.15).a, up(tl,0.15).dy);
  txt('de España - Argentina', W/2, 575+up(tl,0.3).dy, 44, {col:M, w:'600', a:up(tl,0.3).a});
  scoreboard(W/2, 720, t, up(tl,0.5).a, up(tl,0.5).dy);
  txt('ej: 2-1 · 0-0 · 1-3…', W/2, 960+up(tl,0.8).dy, 32, {col:'#8a8a8a', mono:true, a:up(tl,0.8).a});
  rich([{t:'¿Lo ves venir? ',c:M},{t:'Demuéstralo.',c:B}], W/2, 1160, 48, '700', up(tl,1.2).a, up(tl,1.2).dy);
}

const PASOS = [
  ['1','SÍGUEME','para poder avisarte si ganas'],
  ['2','COMENTA','el resultado exacto (ej: 2-1)'],
  ['3','¿ACIERTAS?','2 meses de K-ONE gratis para ti'],
];
function s3(tl, t){
  estadio(t, 0.35);
  txt('CÓMO PARTICIPAR', W/2, 400+up(tl,0).dy, 32, {col:N, w:'700', mono:true, ls:6, a:up(tl,0).a});
  rich([{t:'Solo ',c:B},{t:'3 pasos',c:N}], W/2, 500, 62, '900', up(tl,0.15).a, up(tl,0.15).dy);
  const cx0=110, cw=W-220;
  PASOS.forEach((p,i)=>{
    const ui = up(tl, 0.5+i*0.9, 0.5);
    const y = 630+i*250;
    ctx.save(); ctx.globalAlpha = ui.a;
    card(cx0, y, cw, 210, 1, ui.dy);
    ctx.beginPath(); ctx.arc(cx0+110, y+105+ui.dy, 62, 0, Math.PI*2);
    ctx.fillStyle = N; ctx.fill();
    txt(p[0], cx0+110, y+105+ui.dy, 60, {w:'900', col:'#fff'});
    txt(p[1], cx0+215, y+80+ui.dy, 48, {w:'900', align:'left'});
    txt(p[2], cx0+215, y+140+ui.dy, 33, {col:M, align:'left'});
    ctx.restore();
  });
  txt('Así de simple. Sin trampas.', W/2, 1460+up(tl,3.4).dy, 38, {col:M, a:up(tl,3.4).a});
}

const QUE = [
  'Entreno personalizado con vídeos',
  'Dieta: 5 comidas × 5 opciones',
  'Lista de la compra automática',
  'Se adapta a ti cada semana',
];
function s4(tl, t){
  estadio(t, 0.3);
  const p = pop(tl, 0);
  logoK(W/2, 460, 92, p.a, p.s);
  rich([{t:'¿Y qué es ',c:B},{t:'K-ONE',c:N},{t:'?',c:B}], W/2, 600, 56, '900', up(tl,0.35).a, up(tl,0.35).dy);
  txt('Tu preparador de élite, 24/7', W/2, 675+up(tl,0.5).dy, 38, {col:M, a:up(tl,0.5).a});
  const cx0=110, cw=W-220;
  QUE.forEach((q,i)=>{
    const ui = up(tl, 0.7+i*0.28, 0.45);
    const y = 780+i*140;
    card(cx0, y, cw, 118, ui.a, ui.dy);
    ctx.save(); ctx.globalAlpha = ui.a;
    txt('✓', cx0+52, y+59+ui.dy, 42, {col:V, w:'900', align:'left'});
    txt(q, cx0+125, y+59+ui.dy, 37, {col:'#e6e3de', w:'600', align:'left'});
    ctx.restore();
  });
  txt('Lo que un entrenador de 60€/mes… por 1,99€ el primer mes', W/2, 1430+up(tl,2).dy, 34, {col:M, a:up(tl,2).a});
}

function s5(tl, t){
  estadio(t, 0.55);
  confeti(tl, clamp(tl/0.5,0,1)*0.9);
  txt('EL PREMIO', W/2, 500+up(tl,0).dy, 34, {col:N, w:'700', mono:true, ls:8, a:up(tl,0).a});
  const p = pop(tl, 0.3, 0.55);
  ctx.save(); ctx.globalAlpha = p.a;
  ctx.translate(W/2, 810); ctx.scale(p.s, p.s);
  ctx.shadowColor='rgba(232,73,15,.65)'; ctx.shadowBlur=80;
  txt('2 MESES', 0, -60, 158, {col:N, w:'900'});
  txt('GRATIS', 0, 90, 158, {col:'#fff', w:'900'});
  ctx.restore();
  txt('Plan completo: entreno + dieta + lista de la compra', W/2, 1090+up(tl,0.9).dy, 38, {col:M, w:'600', a:up(tl,0.9).a});
  rich([{t:'(valorado en ',c:M},{t:'39,98€',c:N},{t:')',c:M}], W/2, 1160, 38, '700', up(tl,1.1).a, up(tl,1.1).dy);
}

function s6(tl, t){
  estadio(t, 0.35);
  const p = pop(tl, 0.1);
  ctx.save(); ctx.translate(W/2, 680); ctx.scale(p.s, p.s);
  rich([{t:'⏱ Solo valen comentarios',c:B}], 0, -50, 62, '900', p.a);
  rich([{t:'ANTES del pitido inicial',c:N}], 0, 40, 62, '900', p.a);
  ctx.restore();
  const u = up(tl, 0.8);
  card(140, 880+u.dy, W-280, 250, u.a);
  ctx.save(); ctx.globalAlpha = u.a;
  txt('✓ Resultado exacto (ej: 2-1)', W/2, 950+u.dy, 37, {col:'#e6e3de', w:'600'});

  txt('Si aciertas, te escribo por privado 📩', W/2, 1250+up(tl,1.5).dy, 40, {col:M, w:'600', a:up(tl,1.5).a});
}

/* ---------- draw ---------- */
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.letterSpacing='0px'; ctx.shadowBlur=0;
  ctx.fillStyle = COL.negro; ctx.fillRect(0,0,W,H);

  let key='s1', start=0;
  for (const [k,v] of Object.entries(T)) if (t>=v){ key=k; start=v; }
  const tl = t - start;
  ctx.globalAlpha = clamp(tl/0.3, 0, 1);
  ({s1,s2,s3,s4,s5,s6,s7})[key](tl, t);
  ctx.globalAlpha = 1;
  ctx.fillStyle = N;
  ctx.fillRect(0, 0, W*(t/TOTAL), 7);
}

/* ---------- reproducción / grabación ---------- */
const status = document.getElementById('status');
const btnGen = document.getElementById('gen');
const btnPrev = document.getElementById('prev');
let running = false;

function play(record){
  if (running) return; running = true;
  btnGen.disabled = true; btnPrev.disabled = true;
  window.__videoDone = 0;

  let rec = null, chunks = [], mime = '', ext = '';
  if (record){
    const tipos = [
      ['video/mp4;codecs=avc1.640028','mp4'],
      ['video/mp4','mp4'],
      ['video/webm;codecs=vp9','webm'],
      ['video/webm','webm'],
    ];
    for (const [m,e] of tipos) if (MediaRecorder.isTypeSupported(m)) { mime=m; ext=e; break; }
    if (!mime){ status.textContent = 'Tu navegador no soporta grabación. Usa Chrome actualizado.'; running=false; btnGen.disabled=btnPrev.disabled=false; return; }
    const stream = cv.captureStream(30);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `k-one-final-esp-arg.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      window.__videoDone = blob.size;
      const mb = (blob.size/1048576).toFixed(1);
      status.innerHTML = `✅ Vídeo descargado: <a class="dl" href="${url}" download="k-one-final-esp-arg.${ext}">k-one-final-esp-arg.${ext}</a> (${mb} MB, ${ext.toUpperCase()}).`;
    };
    rec.start(250);
    status.textContent = `⏺ Grabando (${ext.toUpperCase()})… no cambies de pestaña durante 30 s.`;
  } else {
    status.textContent = '▶ Reproduciendo (sin grabar)…';
  }

  const t0 = performance.now();
  function loop(){
    const t = (performance.now()-t0)/1000;
    draw(Math.min(t, TOTAL));
    if (t < TOTAL + 0.3){ requestAnimationFrame(loop); }
    else {
      if (rec) rec.stop();
      else status.textContent = 'Listo. Pulsa 🎬 para generar el archivo.';
      running = false; btnGen.disabled = btnPrev.disabled = false;
    }
  }
  requestAnimationFrame(loop);
}

btnGen.addEventListener('click', () => play(true));
btnPrev.addEventListener('click', () => play(false));
draw(0.001);

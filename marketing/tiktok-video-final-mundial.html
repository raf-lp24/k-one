const clamp = (x,a,b) => Math.max(a, Math.min(b,x));
const easeOut = x => 1 - Math.pow(1-x,3);

function up(tl, d, dur=0.55){ const x = clamp((tl-d)/dur, 0, 1); return { a:x, dy:40*(1-easeOut(x)) }; }

}
function txt(str, x, y, size, {w='400', col:c='#fff', align='center', mono=false, ls=0, a=1} = {}){

  setFont(size, w, mono, ls);
  ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rich(segs, cx, y, size, weight='900', a=1, dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, weight);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tot = segs.reduce((s,seg)=> s + ctx.measureText(seg.t).width, 0);
  let x = cx - tot/2;
  for (const seg of segs){
    ctx.fillStyle = seg.c || '#fff';
    ctx.fillText(seg.t, x, y + dy);
    x += ctx.measureText(seg.t).width;
  }
  ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function card(x,y,w,h,a=1,dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y+dy, w, h, 22);
  ctx.fillStyle = 'rgba(20,20,20,0.92)'; ctx.fill();
  ctx.strokeStyle = COL.borde; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function logoK(cx, y, size, a=1, s=1){
  ctx.save(); ctx.globalAlpha *= a;
  ctx.translate(cx,y); ctx.scale(s,s); ctx.translate(-cx,-y);
  setFont(size,'900',false,6);
  ctx.textBaseline='middle'; ctx.textAlign='left';
  const w1 = ctx.measureText('K-').width, w2 = ctx.measureText('ONE').width;
  let x = cx-(w1+w2)/2;
  ctx.fillStyle='#fff'; ctx.fillText('K-',x,y);
  ctx.fillStyle=N; ctx.fillText('ONE',x+w1,y);
  ctx.restore();
}

function estadioDibujado(t, k){ // respaldo por si la foto no ha cargado
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#06070c'); g.addColorStop(0.42, '#0d0f16'); g.addColorStop(0.62, '#0a0a0a'); g.addColorStop(1, '#0b0b0b');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = 'rgba(22,25,34,0.9)'; ctx.fillRect(0, 120, W, 540);
  CROWD.forEach(p=>{
    const tw = 0.35 + 0.3*Math.sin(t*1.4+p.ph);
    ctx.fillStyle = p.tint<0.33 ? `rgba(120,130,150,${tw})` : `rgba(90,95,110,${tw})`;
    ctx.fillRect(p.x, p.y, p.sz, p.sz);
  });
  ctx.restore();
}
function estadio(t, k=1){
  if (STADIUM.complete && STADIUM.naturalWidth > 0){
    // cubrir el lienzo con la foto + leve zoom para que "respire"
    const zoom = 1.06 + 0.03*Math.sin(t*0.22);
    const scale = Math.max(W/STADIUM.naturalWidth, H/STADIUM.naturalHeight) * zoom;
    const nw = STADIUM.naturalWidth*scale, nh = STADIUM.naturalHeight*scale;
    ctx.drawImage(STADIUM, (W-nw)/2, (H-nh)/2 - 20, nw, nh);
    // oscurecido para que el texto se lea (más oscuro cuanto menor k)
    const base = 0.40 + (1-k)*0.34;
    const gg = ctx.createLinearGradient(0,0,0,H);
    gg.addColorStop(0,   `rgba(8,9,14,${clamp(base+0.20,0,0.95)})`);
    gg.addColorStop(0.4, `rgba(8,9,14,${clamp(base-0.06,0,0.9)})`);
    gg.addColorStop(1,   `rgba(8,9,14,${clamp(base+0.22,0,0.96)})`);
    ctx.fillStyle = gg; ctx.fillRect(0,0,W,H);
  } else {
    estadioDibujado(t, k);
  }
  // viñeta
  const v = ctx.createRadialGradient(W/2, H*0.45, 300, W/2, H*0.5, 1200);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
}

/* ============ BANDERAS ONDEANDO ============ */
/* dibuja la bandera en rebanadas verticales con onda senoidal */
function flagWave(x, y, w, h, t, bands, sunAt){
  const SL = 42;
  for (let i=0;i<SL;i++){
    const fx = i/SL;
    const dy = Math.sin(fx*4.2 + t*3.1) * h*0.055 * (0.35+fx);
    const sx = x + fx*w, sw = w/SL + 1;
    let by = y + dy;
    for (const [frac, col] of bands){
      ctx.fillStyle = col;
      ctx.fillRect(sx, by, sw, h*frac);
      by += h*frac;
    }
    // sombra ondulada para volumen
    const sh = 0.10 + 0.10*Math.sin(fx*4.2 + t*3.1 + 1.4);
    ctx.fillStyle = `rgba(0,0,0,${clamp(sh,0,0.2)})`;
    ctx.fillRect(sx, y+dy, sw, h);
  }
  // sol de Argentina (encima, siguiendo la onda del centro)
  if (sunAt){
    const fx = 0.5;
    const dy = Math.sin(fx*4.2 + t*3.1) * h*0.055 * (0.35+fx);
    const cxx = x + w/2, cyy = y + h/2 + dy;
    ctx.save();
    ctx.fillStyle = COL.argSol;
    ctx.beginPath(); ctx.arc(cxx, cyy, h*0.115, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = COL.argSol; ctx.lineWidth = 2.6;
    for (let r=0;r<16;r++){
      const an = r/16*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cxx + Math.cos(an)*h*0.135, cyy + Math.sin(an)*h*0.135);
      ctx.lineTo(cxx + Math.cos(an)*h*0.185, cyy + Math.sin(an)*h*0.185);
      ctx.stroke();
    }
    ctx.restore();
  }
}
function banderaEsp(x,y,w,h,t,a=1){
  ctx.save(); ctx.globalAlpha *= a;
  flagWave(x,y,w,h,t, [[0.25,COL.espRojo],[0.5,COL.espAmarillo],[0.25,COL.espRojo]]);
  ctx.restore();
}
function banderaArg(x,y,w,h,t,a=1){
  ctx.save(); ctx.globalAlpha *= a;
  flagWave(x,y,w,h,t, [[0.3333,COL.argCeleste],[0.3334,'#ffffff'],[0.3333,COL.argCeleste]], true);
  ctx.restore();
}
/* mini banderas planas para el marcador */
function miniEsp(x,y,w,h){
  rrect(x,y,w,h,8); ctx.save(); ctx.clip();
  ctx.fillStyle=COL.espRojo; ctx.fillRect(x,y,w,h/4);

}
function miniArg(x,y,w,h){
  rrect(x,y,w,h,8); ctx.save(); ctx.clip();

/* marcador estilo retransmisión */
function scoreboard(cx, y, t, a=1, dy=0, scoreTxt='? - ?'){
  ctx.save(); ctx.globalAlpha *= a;

  rrect(x, y+dy, w, h, 20);

  gg.addColorStop(0,'rgba(30,32,40,0.96)'); gg.addColorStop(1,'rgba(12,13,17,0.96)');

  // marcador pulsante

/* confeti determinista */
const CONF = [];
(function(){
  let s = 42;
  const rnd = () => { s = (s*1103515245+12345) % 2147483648; return s/2147483648; };
  for (let i=0;i<110;i++) CONF.push({ x:rnd()*W, v:250+rnd()*350, ph:rnd()*6.28, sz:8+rnd()*12,
    c:[N,COL.espRojo,COL.espAmarillo,'#fff',COL.argCeleste,ORO][Math.floor(rnd()*6)] });
})();
function confeti(tl, a=1){
  ctx.save(); ctx.globalAlpha *= a;
  CONF.forEach(p => {
    const y = (p.ph*300 + tl*p.v) % (H+80) - 40;
    const x = p.x + Math.sin(tl*2.4 + p.ph)*38;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tl*3+p.ph);
    ctx.fillStyle = p.c; ctx.fillRect(-p.sz/2, -p.sz/4, p.sz, p.sz/2);
    ctx.restore();
  });
  ctx.restore();
}

/* ---------- draw ---------- */
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.letterSpacing='0px'; ctx.shadowBlur=0;
  ctx.fillStyle = COL.negro; ctx.fillRect(0,0,W,H);

  let key='s1', start=0;
  for (const [k,v] of Object.entries(T)) if (t>=v){ key=k; start=v; }
  const tl = t - start;
  ctx.globalAlpha = clamp(tl/0.3, 0, 1);
  ({s1,s2,s3,s4,s5,s6,s7})[key](tl, t);
  ctx.globalAlpha = 1;
  ctx.fillStyle = N;
  ctx.fillRect(0, 0, W*(t/TOTAL), 7);
}

/* ---------- reproducción / grabación ---------- */
const status = document.getElementById('status');
const btnGen = document.getElementById('gen');
const btnPrev = document.getElementById('prev');
let running = false;

function play(record){
  if (running) return; running = true;
  btnGen.disabled = true; btnPrev.disabled = true;
  window.__videoDone = 0;

  let rec = null, chunks = [], mime = '', ext = '';
  if (record){
    const tipos = [
      ['video/mp4;codecs=avc1.640028','mp4'],
      ['video/mp4','mp4'],
      ['video/webm;codecs=vp9','webm'],
      ['video/webm','webm'],
    ];
    for (const [m,e] of tipos) if (MediaRecorder.isTypeSupported(m)) { mime=m; ext=e; break; }
    if (!mime){ status.textContent = 'Tu navegador no soporta grabación. Usa Chrome actualizado.'; running=false; btnGen.disabled=btnPrev.disabled=false; return; }
    const stream = cv.captureStream(30);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `k-one-final-esp-arg.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      window.__videoDone = blob.size;
      const mb = (blob.size/1048576).toFixed(1);
      status.innerHTML = `✅ Vídeo descargado: <a class="dl" href="${url}" download="k-one-final-esp-arg.${ext}">k-one-final-esp-arg.${ext}</a> (${mb} MB, ${ext.toUpperCase()}).`;
    };
    rec.start(250);
    status.textContent = `⏺ Grabando (${ext.toUpperCase()})… no cambies de pestaña durante 30 s.`;
  } else {
    status.textContent = '▶ Reproduciendo (sin grabar)…';
  }

  const t0 = performance.now();
  function loop(){
    const t = (performance.now()-t0)/1000;
    draw(Math.min(t, TOTAL));
    if (t < TOTAL + 0.3){ requestAnimationFrame(loop); }
    else {
      if (rec) rec.stop();
      else status.textContent = 'Listo. Pulsa 🎬 para generar el archivo.';
      running = false; btnGen.disabled = btnPrev.disabled = false;
    }
  }
  requestAnimationFrame(loop);
}

btnGen.addEventListener('click', () => play(true));
btnPrev.addEventListener('click', () => play(false));
draw(0.001);

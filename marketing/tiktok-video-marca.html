<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>K-ONE · Vídeo TikTok: qué es K-ONE (marca y método)</title>
<style>
  body { background:#000; color:#ccc; font-family:'Segoe UI',Arial,sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px; margin:0; min-height:100vh; justify-content:center; }
  canvas { height:min(72vh,720px); aspect-ratio:9/16; border-radius:10px; box-shadow:0 0 50px rgba(232,73,15,.2); background:#0b0b0b; }
  .btns { display:flex; gap:10px; }
  button { background:#E8490F; color:#fff; border:0; border-radius:8px; padding:13px 30px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
  button.sec { background:#222; }
  button:disabled { opacity:.4; cursor:default; }
  #status { font-size:14px; color:#888; min-height:20px; text-align:center; max-width:460px; line-height:1.5; }
  a.dl { color:#E8490F; font-weight:700; }
</style>
</head>
<body>

<canvas id="cv" width="1080" height="1920"></canvas>
<div class="btns">
  <button id="gen">🎬 GENERAR VÍDEO (29s)</button>
  <button class="sec" id="prev">Solo ver</button>
</div>
<div id="status">Pulsa <b>Generar vídeo</b>: se reproduce una vez y al acabar se descarga el archivo listo para WhatsApp/TikTok (1080×1920).</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const TOTAL = 29;

const COL = {
  naranja:'#E8490F', negro:'#0b0b0b', grafito:'#141414', carbon:'#1E1E1E',
  hueso:'#F0EDE8', metal:'#b5b2ad', borde:'#222222', sep:'#1d1d1d', verde:'#27ae60'
};
const FONT = '"Segoe UI", Arial, sans-serif';
const MONO = 'Consolas, "Courier New", monospace';
const N = COL.naranja, M = COL.metal, B = '#fff';

/* ---------- helpers ---------- */
const clamp = (x,a,b) => Math.max(a, Math.min(b,x));
const easeOut = x => 1 - Math.pow(1-x,3);
function popE(x){ const c = 1.70158; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); }
function up(tl, d, dur=0.55){ const x = clamp((tl-d)/dur, 0, 1); return { a:x, dy:40*(1-easeOut(x)) }; }
function pop(tl, d, dur=0.5){ const x = clamp((tl-d)/dur, 0, 1); return { a:clamp(x*2,0,1), s: x===0 ? .6 : .6+.4*popE(x) }; }

function setFont(size, weight='400', mono=false, ls=0){
  ctx.font = `${weight} ${size}px ${mono?MONO:FONT}`;
  ctx.letterSpacing = ls + 'px';
}
function txt(str, x, y, size, {w='400', col:c='#fff', align='center', mono=false, ls=0, a=1} = {}){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, w, mono, ls);
  ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rich(segs, cx, y, size, weight='900', a=1, dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, weight);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tot = segs.reduce((s,seg)=> s + ctx.measureText(seg.t).width, 0);
  let x = cx - tot/2;
  for (const seg of segs){
    ctx.fillStyle = seg.c || '#fff';
    ctx.fillText(seg.t, x, y + dy);
    x += ctx.measureText(seg.t).width;
  }
  ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function card(x,y,w,h,a=1,dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y+dy, w, h, 22);
  ctx.fillStyle = COL.grafito; ctx.fill();
  ctx.strokeStyle = COL.borde; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function logoK(cx, y, size, a=1, s=1){
  ctx.save(); ctx.globalAlpha *= a;
  ctx.translate(cx,y); ctx.scale(s,s); ctx.translate(-cx,-y);
  setFont(size,'900',false,6);
  ctx.textBaseline='middle'; ctx.textAlign='left';
  const w1 = ctx.measureText('K-').width, w2 = ctx.measureText('ONE').width;
  let x = cx-(w1+w2)/2;
  ctx.fillStyle='#fff'; ctx.fillText('K-',x,y);
  ctx.fillStyle=N; ctx.fillText('ONE',x+w1,y);
  ctx.restore();
}

/* ---------- timeline ----------
   s1 0     hook "no es una app de fitness"
   s2 2.8   "es un sistema de disciplina" + claim
   s3 5.6   el motor: tus datos
   s4 10.4  bases reales del método
   s5 15.2  "no es magia, es método"
   s6 18    aprende de ti cada semana (check-in)
   s7 22.8  mentalidad
   s8 25.6  CTA cierre
--------------------------------- */
const T = { s1:0, s2:2.8, s3:5.6, s4:10.4, s5:15.2, s6:18, s7:22.8, s8:25.6 };

function s1(tl){ // HOOK
  const fa = tl<0.2 ? tl/0.2 : clamp(1-(tl-0.2)/0.25,0,1);
  ctx.fillStyle = `rgba(232,73,15,${0.12*fa})`; ctx.fillRect(0,0,W,H);
  const p = pop(tl, 0.15);
  ctx.save(); ctx.translate(W/2, 850); ctx.scale(p.s,p.s); ctx.translate(-W/2,-850);
  logoK(W/2, 760, 90, p.a, 1);
  rich([{t:'no es una app',c:B}], W/2, 900, 88, '900', p.a);
  rich([{t:'de fitness.',c:B}], W/2, 1006, 88, '900', p.a);
  ctx.restore();
  const u = up(tl, 1.1);
  txt('Te cuento lo que hay detrás 👇', W/2, 1180+u.dy, 50, {col:M, w:'700', a:u.a});
}

function s2(tl){ // SISTEMA DE DISCIPLINA
  const p = pop(tl, 0.1);
  ctx.save(); ctx.translate(W/2,860); ctx.scale(p.s,p.s); ctx.translate(-W/2,-860);
  rich([{t:'Es un ',c:B},{t:'sistema',c:N}], W/2, 810, 88, '900', p.a);
  rich([{t:'de disciplina',c:B}], W/2, 916, 88, '900', p.a);
  ctx.restore();
  const u = up(tl, 0.8);
  txt('NO HAY ATAJOS. HAY PASOS.', W/2, 1100+u.dy, 34, {col:N, w:'700', mono:true, ls:5, a:u.a});
}

const DATOS = [
  ['Peso','78 kg'], ['Altura','180 cm'], ['Deporte','CrossFit'],
  ['Objetivo','Perder grasa'], ['Lesión','Hombro'], ['Alergia','Lactosa'],
];
function s3(tl){ // EL MOTOR: TUS DATOS
  const u0=up(tl,0), u1=up(tl,0.15);
  txt('EL MOTOR', W/2, 400+u0.dy, 30, {col:N, w:'700', mono:true, ls:6, a:u0.a});
  rich([{t:'Todo sale de ',c:B},{t:'tus datos',c:N}], W/2, 495, 56, '800', u1.a, u1.dy);
  // grid 2 columnas de datos
  const cw2 = (W-192-24)/2;
  DATOS.forEach((d,i)=>{
    const col = i%2, fila = Math.floor(i/2);
    const x = 96 + col*(cw2+24), y = 610 + fila*146;
    const ui = up(tl, 0.5+i*0.14, 0.45);
    card(x, y, cw2, 126, ui.a, ui.dy);
    ctx.save(); ctx.globalAlpha = ui.a;
    txt(d[0].toUpperCase(), x+38, y+40+ui.dy, 23, {col:N, w:'700', mono:true, ls:2, align:'left'});
    txt(d[1], x+38, y+84+ui.dy, 36, {col:'#e6e3de', w:'700', align:'left'});
    ctx.restore();
  });
  // flecha + resultado
  const uf = up(tl, 1.7);
  txt('↓', W/2, 1120+uf.dy, 60, {col:N, w:'900', a:uf.a});
  const ur = up(tl, 2.0);
  ctx.save(); ctx.globalAlpha = ur.a;
  ctx.shadowColor='rgba(232,73,15,.4)'; ctx.shadowBlur=40;
  rrect(96, 1190+ur.dy, W-192, 120, 20);
  ctx.fillStyle = 'rgba(232,73,15,.14)'; ctx.fill();
  ctx.strokeStyle = N; ctx.lineWidth=3; ctx.stroke();
  ctx.shadowBlur=0;
  txt('TU PLAN · ÚNICO PARA TI', W/2, 1250+ur.dy, 36, {col:'#fff', w:'800'});
  ctx.restore();
  txt('nada genérico, nada copiado de otro', W/2, 1420+up(tl,2.4).dy, 37, {col:M, a:up(tl,2.4).a});
}

const BASES = [
  ['Calorías y macros','tu TDEE real'],
  ['Periodización','semana a semana'],
  ['Lesiones','ejercicios excluidos'],
  ['Alergias','comidas excluidas'],
  ['Progresión','sobrecarga gradual'],
];
function s4(tl){ // BASES DEL MÉTODO
  const u0=up(tl,0), u1=up(tl,0.15);
  txt('LAS BASES', W/2, 420+u0.dy, 30, {col:N, w:'700', mono:true, ls:6, a:u0.a});
  rich([{t:'Ciencia del entreno,',c:B}], W/2, 515, 56, '800', u1.a, u1.dy);
  rich([{t:'no humo',c:N}], W/2, 588, 56, '800', u1.a, u1.dy);
  const cx0=96, cw=W-192;
  BASES.forEach((b,i)=>{
    const ui = up(tl, 0.6+i*0.16, 0.45);
    const y = 690+i*128;
    card(cx0, y, cw, 108, ui.a, ui.dy);
    ctx.save(); ctx.globalAlpha=ui.a;
    txt('✓', cx0+44, y+54+ui.dy, 36, {col:COL.verde, w:'900', align:'left'});
    txt(b[0], cx0+108, y+54+ui.dy, 35, {col:'#e6e3de', w:'700', align:'left'});
    txt(b[1], cx0+cw-46, y+54+ui.dy, 29, {col:M, mono:true, align:'right'});
    ctx.restore();
  });
  txt('lo mismo que haría un preparador de verdad', W/2, 1440+up(tl,1.9).dy, 37, {col:M, a:up(tl,1.9).a});
}

function s5(tl){ // NO ES MAGIA
  const p = pop(tl, 0.1);
  ctx.save(); ctx.translate(W/2,860); ctx.scale(p.s,p.s); ctx.translate(-W/2,-860);
  rich([{t:'No es magia.',c:B}], W/2, 810, 92, '900', p.a);
  rich([{t:'Es ',c:B},{t:'método',c:N},{t:'.',c:B}], W/2, 920, 92, '900', p.a);
  ctx.restore();
  const u = up(tl, 0.8);
  txt('el mismo que usan los atletas: constancia + progresión', W/2, 1100+u.dy, 38, {col:M, w:'600', a:u.a});
}

const CHECKIN = [
  ['Check-in semanal','1 minuto'],
  ['¿Te resultó fácil?','sube la carga'],
  ['¿Demasiado duro?','ajusta el volumen'],
  ['¿Plato que no repites?','fuera del plan'],
];
function s6(tl){ // APRENDE DE TI
  const u0=up(tl,0), u1=up(tl,0.15);
  txt('Y ADEMÁS', W/2, 420+u0.dy, 30, {col:N, w:'700', mono:true, ls:6, a:u0.a});
  rich([{t:'Aprende de ti',c:B}], W/2, 515, 56, '800', u1.a, u1.dy);
  rich([{t:'cada semana',c:N}], W/2, 588, 56, '800', u1.a, u1.dy);
  const cx0=96, cw=W-192;
  CHECKIN.forEach((c,i)=>{
    const ui = up(tl, 0.6+i*0.18, 0.45);
    const y = 700+i*136;
    card(cx0, y, cw, 114, ui.a, ui.dy);
    ctx.save(); ctx.globalAlpha=ui.a;
    txt(c[0], cx0+46, y+57+ui.dy, 35, {col:'#e6e3de', w:'600', align:'left'});
    txt('→ '+c[1], cx0+cw-46, y+57+ui.dy, 30, {col:N, w:'700', mono:true, align:'right'});
    ctx.restore();
  });
  txt('tu plan evoluciona contigo, no contra ti', W/2, 1360+up(tl,1.6).dy, 37, {col:M, a:up(tl,1.6).a});
}

function s7(tl){ // MENTALIDAD
  const p = pop(tl, 0.1);
  ctx.save(); ctx.translate(W/2,830); ctx.scale(p.s,p.s); ctx.translate(-W/2,-830);
  rich([{t:'La motivación ',c:B},{t:'arranca',c:M}], W/2, 770, 74, '900', p.a);
  rich([{t:'La ',c:B},{t:'disciplina',c:N},{t:' mantiene',c:B}], W/2, 880, 74, '900', p.a);
  ctx.restore();
  const u = up(tl, 0.9);
  txt('«Un paso cada vez»', W/2, 1070+u.dy, 46, {col:'#F0EDE8', w:'600', a:u.a});
}

function s8(tl){ // CTA CIERRE
  const u0 = up(tl, 0);
  txt('Entreno + nutrición + método real', W/2, 640+u0.dy, 38, {col:M, a:u0.a});
  const p = pop(tl, 0.35, 0.55);
  ctx.save(); ctx.globalAlpha=p.a;
  ctx.translate(W/2,860); ctx.scale(p.s,p.s); ctx.translate(-W/2,-860);
  ctx.shadowColor='rgba(232,73,15,.55)'; ctx.shadowBlur=70;
  txt('1,99€', W/2, 860, 190, {col:N, w:'900'});
  ctx.restore();
  txt('el primer mes · sin permanencia', W/2, 1030+u0.dy, 38, {col:M, a:up(tl,0.8).a});
  const u2 = up(tl, 1.1), u3 = up(tl, 1.4);
  logoK(W/2, 1200+u2.dy, 76, u2.a, 1);
  rich([{t:'k-one',c:'#fff'},{t:'.fit',c:N},{t:'  ·  🔗 link en la bio',c:M}], W/2, 1310, 36, '700', u3.a, u3.dy);
}

/* ---------- draw ---------- */
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.letterSpacing='0px'; ctx.shadowBlur=0;
  ctx.fillStyle = COL.negro; ctx.fillRect(0,0,W,H);

  let key='s1', start=0;
  for (const [k,v] of Object.entries(T)) if (t>=v){ key=k; start=v; }
  const tl = t - start;
  ctx.globalAlpha = clamp(tl/0.3, 0, 1);
  ({s1,s2,s3,s4,s5,s6,s7,s8})[key](tl);
  ctx.globalAlpha = 1;
  ctx.fillStyle = N;
  ctx.fillRect(0, 0, W*(t/TOTAL), 7);
}

/* ---------- reproducción / grabación ---------- */
const status = document.getElementById('status');
const btnGen = document.getElementById('gen');
const btnPrev = document.getElementById('prev');
let running = false;

function play(record){
  if (running) return; running = true;
  btnGen.disabled = true; btnPrev.disabled = true;
  window.__videoDone = 0;

  let rec = null, chunks = [], mime = '', ext = '';
  if (record){
    const tipos = [
      ['video/mp4;codecs=avc1.640028','mp4'],
      ['video/mp4','mp4'],
      ['video/webm;codecs=vp9','webm'],
      ['video/webm','webm'],
    ];
    for (const [m,e] of tipos) if (MediaRecorder.isTypeSupported(m)) { mime=m; ext=e; break; }
    if (!mime){ status.textContent = 'Tu navegador no soporta grabación. Usa Chrome actualizado.'; running=false; btnGen.disabled=btnPrev.disabled=false; return; }
    const stream = cv.captureStream(30);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `k-one-marca.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      window.__videoDone = blob.size;
      const mb = (blob.size/1048576).toFixed(1);
      status.innerHTML = `✅ Vídeo descargado: <a class="dl" href="${url}" download="k-one-marca.${ext}">k-one-marca.${ext}</a> (${mb} MB, ${ext.toUpperCase()}). Envíalo por WhatsApp como <b>documento</b> para no perder calidad.`;
    };
    rec.start(250);
    status.textContent = `⏺ Grabando (${ext.toUpperCase()})… no cambies de pestaña durante 29 s.`;
  } else {
    status.textContent = '▶ Reproduciendo (sin grabar)…';
  }

  const t0 = performance.now();
  function loop(){
    const t = (performance.now()-t0)/1000;
    draw(Math.min(t, TOTAL));
    if (t < TOTAL + 0.3){ requestAnimationFrame(loop); }
    else {
      if (rec) rec.stop();
      else status.textContent = 'Listo. Pulsa 🎬 para generar el archivo.';
      running = false; btnGen.disabled = btnPrev.disabled = false;
    }
  }
  requestAnimationFrame(loop);
}

btnGen.addEventListener('click', () => play(true));
btnPrev.addEventListener('click', () => play(false));
draw(0.001);
</script>
</body>
</html>

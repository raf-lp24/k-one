<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>K-ONE · Vídeo TikTok: sorteo Francia vs España</title>
<style>
  body { background:#000; color:#ccc; font-family:'Segoe UI',Arial,sans-serif; display:flex; flex-direction:column; align-items:center; gap:14px; padding:20px; margin:0; min-height:100vh; justify-content:center; }
  canvas { height:min(72vh,720px); aspect-ratio:9/16; border-radius:10px; box-shadow:0 0 50px rgba(232,73,15,.2); background:#0b0b0b; }
  .btns { display:flex; gap:10px; }
  button { background:#E8490F; color:#fff; border:0; border-radius:8px; padding:13px 30px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; }
  button.sec { background:#222; }
  button:disabled { opacity:.4; cursor:default; }
  #status { font-size:14px; color:#888; min-height:20px; text-align:center; max-width:460px; line-height:1.5; }
  a.dl { color:#E8490F; font-weight:700; }
</style>
</head>
<body>

<canvas id="cv" width="1080" height="1920"></canvas>
<div class="btns">
  <button id="gen">🎬 GENERAR VÍDEO (28s)</button>
  <button class="sec" id="prev">Solo ver</button>
</div>
<div id="status">Pulsa <b>Generar vídeo</b>: se reproduce una vez y al acabar se descarga el archivo listo para TikTok (1080×1920).</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 1080, H = 1920;
const TOTAL = 28;

const COL = {
  naranja:'#E8490F', negro:'#0b0b0b', grafito:'#141414', carbon:'#1E1E1E',
  hueso:'#F0EDE8', metal:'#b5b2ad', borde:'#222222', verde:'#27ae60',
  fraAzul:'#0055A4', fraRojo:'#EF4135', espRojo:'#AA151B', espAmarillo:'#F1BF00'
};
const FONT = '"Segoe UI", Arial, sans-serif';
const MONO = 'Consolas, "Courier New", monospace';
const N = COL.naranja, M = COL.metal, B = '#fff', V = COL.verde;

/* ---------- helpers ---------- */
const clamp = (x,a,b) => Math.max(a, Math.min(b,x));
const easeOut = x => 1 - Math.pow(1-x,3);
function popE(x){ const c = 1.70158; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); }
function up(tl, d, dur=0.55){ const x = clamp((tl-d)/dur, 0, 1); return { a:x, dy:40*(1-easeOut(x)) }; }
function pop(tl, d, dur=0.5){ const x = clamp((tl-d)/dur, 0, 1); return { a:clamp(x*2,0,1), s: x===0 ? .6 : .6+.4*popE(x) }; }

function setFont(size, weight='400', mono=false, ls=0){
  ctx.font = `${weight} ${size}px ${mono?MONO:FONT}`;
  ctx.letterSpacing = ls + 'px';
}
function txt(str, x, y, size, {w='400', col:c='#fff', align='center', mono=false, ls=0, a=1} = {}){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, w, mono, ls);
  ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
  ctx.restore();
}
function rich(segs, cx, y, size, weight='900', a=1, dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  setFont(size, weight);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const tot = segs.reduce((s,seg)=> s + ctx.measureText(seg.t).width, 0);
  let x = cx - tot/2;
  for (const seg of segs){
    ctx.fillStyle = seg.c || '#fff';
    ctx.fillText(seg.t, x, y + dy);
    x += ctx.measureText(seg.t).width;
  }
  ctx.restore();
}
function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }
function card(x,y,w,h,a=1,dy=0){
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y+dy, w, h, 22);
  ctx.fillStyle = COL.grafito; ctx.fill();
  ctx.strokeStyle = COL.borde; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function logoK(cx, y, size, a=1, s=1){
  ctx.save(); ctx.globalAlpha *= a;
  ctx.translate(cx,y); ctx.scale(s,s); ctx.translate(-cx,-y);
  setFont(size,'900',false,6);
  ctx.textBaseline='middle'; ctx.textAlign='left';
  const w1 = ctx.measureText('K-').width, w2 = ctx.measureText('ONE').width;
  let x = cx-(w1+w2)/2;
  ctx.fillStyle='#fff'; ctx.fillText('K-',x,y);
  ctx.fillStyle=N; ctx.fillText('ONE',x+w1,y);
  ctx.restore();
}

/* banderas dibujadas (redondeadas) */
function banderaFrancia(x, y, w, h, a=1){
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y, w, h, 14); ctx.clip();
  ctx.fillStyle = COL.fraAzul; ctx.fillRect(x, y, w/3, h);
  ctx.fillStyle = '#fff';     ctx.fillRect(x+w/3, y, w/3, h);
  ctx.fillStyle = COL.fraRojo; ctx.fillRect(x+2*w/3, y, w/3, h);
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y, w, h, 14); ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();
}
function banderaEspana(x, y, w, h, a=1){
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y, w, h, 14); ctx.clip();
  ctx.fillStyle = COL.espRojo;     ctx.fillRect(x, y, w, h/4);
  ctx.fillStyle = COL.espAmarillo; ctx.fillRect(x, y+h/4, w, h/2);
  ctx.fillStyle = COL.espRojo;     ctx.fillRect(x, y+3*h/4, w, h/4);
  ctx.restore();
  ctx.save(); ctx.globalAlpha *= a;
  rrect(x, y, w, h, 14); ctx.strokeStyle='#333'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();
}

/* confeti determinista */
const CONF = [];
(function(){
  let s = 42;
  const rnd = () => { s = (s*1103515245+12345) % 2147483648; return s/2147483648; };
  for (let i=0;i<90;i++) CONF.push({ x:rnd()*W, v:250+rnd()*350, ph:rnd()*6.28, sz:8+rnd()*12,
    c:[N,V,'#F1BF00','#fff',COL.fraAzul][Math.floor(rnd()*5)] });
})();
function confeti(tl, a=1){
  ctx.save(); ctx.globalAlpha *= a;
  CONF.forEach(p => {
    const y = (p.ph*300 + tl*p.v) % (H+80) - 40;
    const x = p.x + Math.sin(tl*2.4 + p.ph)*38;
    ctx.save(); ctx.translate(x,y); ctx.rotate(tl*3+p.ph);
    ctx.fillStyle = p.c; ctx.fillRect(-p.sz/2, -p.sz/4, p.sz, p.sz/2);
    ctx.restore();
  });
  ctx.restore();
}

/* ---------- timeline ----------
   s1 0     VS: Francia vs España
   s2 3     marcador ?-? "acierta el resultado exacto"
   s3 6     cómo participar (3 pasos)
   s4 12.6  qué es K-ONE (rápido)
   s5 17    EL PREMIO: 1 mes gratis + confeti
   s6 20.8  reglas: antes del pitido, resultado exacto
   s7 24    CTA final con burbujas de comentarios
--------------------------------- */
const T = { s1:0, s2:3, s3:6, s4:12.6, s5:17, s6:20.8, s7:24 };

function s1(tl){ // VS
  // flash inicial
  const fa = tl<0.2 ? tl/0.2 : clamp(1-(tl-0.2)/0.25,0,1);
  ctx.fillStyle = `rgba(232,73,15,${0.14*fa})`; ctx.fillRect(0,0,W,H);
  txt('HOY · MUNDIAL 2026', W/2, 430+up(tl,0).dy, 34, {col:N, w:'700', mono:true, ls:6, a:up(tl,0).a});
  // banderas entran desde los lados
  const kF = easeOut(clamp((tl-0.25)/0.5,0,1));
  const kE = easeOut(clamp((tl-0.45)/0.5,0,1));
  const bw = 340, bh = 226;
  banderaFrancia(-bw + kF*(150+bw), 640, bw, bh, kF);
  banderaEspana(W - kE*(150+bw), 640, bw, bh, kE);
  txt('FRANCIA', 150+bw/2, 950, 44, {w:'900', a:kF});
  txt('ESPAÑA',  W-150-bw/2, 950, 44, {w:'900', a:kE});
  // VS gigante con pop
  const p = pop(tl, 0.9, 0.45);
  ctx.save(); ctx.globalAlpha = p.a;
  ctx.translate(W/2, 760); ctx.scale(p.s, p.s);
  ctx.shadowColor='rgba(232,73,15,.6)'; ctx.shadowBlur=60;
  txt('VS', 0, 0, 130, {col:N, w:'900'});
  ctx.restore();
  const u = up(tl, 1.4);
  rich([{t:'Y tú te juegas ',c:B},{t:'un MES GRATIS',c:N}], W/2, 1130, 62, '900', u.a, u.dy);
  txt('de entrenador personal digital 👇', W/2, 1220+u.dy, 44, {col:M, w:'600', a:up(tl,1.7).a});
}

function s2(tl){ // MARCADOR ?-?
  txt('SORTEO', W/2, 430+up(tl,0).dy, 34, {col:N, w:'700', mono:true, ls:8, a:up(tl,0).a});
  rich([{t:'Acierta el ',c:B},{t:'resultado exacto',c:N}], W/2, 540, 60, '900', up(tl,0.15).a, up(tl,0.15).dy);
  // marcador
  const u = up(tl, 0.45);
  ctx.save(); ctx.globalAlpha = u.a;
  card(120, 700+u.dy, W-240, 380, 1, 0);
  banderaFrancia(190, 760+u.dy, 200, 133);
  banderaEspana(W-190-200, 760+u.dy, 200, 133);
  txt('FRA', 290, 950+u.dy, 38, {w:'800', mono:true});
  txt('ESP', W-290, 950+u.dy, 38, {w:'800', mono:true});
  // interrogantes pulsando
  const pk = 1 + Math.sin(tl*4)*0.10;
  ctx.save(); ctx.translate(W/2, 850+u.dy); ctx.scale(pk, pk);
  ctx.shadowColor='rgba(232,73,15,.55)'; ctx.shadowBlur=45;
  txt('? - ?', 0, 0, 110, {col:N, w:'900', mono:true});
  ctx.restore();
  txt('ej: 2-1 · 0-0 · 1-3…', W/2, 1000+u.dy, 30, {col:'#777', mono:true});
  ctx.restore();
  rich([{t:'¿Lo ves venir? ',c:M},{t:'Demuéstralo.',c:B}], W/2, 1220, 46, '700', up(tl,1.1).a, up(tl,1.1).dy);
}

const PASOS = [
  ['1','SÍGUEME','para poder avisarte si ganas'],
  ['2','COMENTA','el resultado exacto (ej: 2-1)'],
  ['3','¿ACIERTAS?','1 mes de K-ONE gratis para ti'],
];
function s3(tl){ // CÓMO PARTICIPAR
  txt('CÓMO PARTICIPAR', W/2, 420+up(tl,0).dy, 32, {col:N, w:'700', mono:true, ls:6, a:up(tl,0).a});
  rich([{t:'Solo ',c:B},{t:'3 pasos',c:N}], W/2, 520, 62, '900', up(tl,0.15).a, up(tl,0.15).dy);
  const cx0=110, cw=W-220;
  PASOS.forEach((p,i)=>{
    const ui = up(tl, 0.5+i*0.9, 0.5);
    const y = 650+i*250;
    ctx.save(); ctx.globalAlpha = ui.a;
    card(cx0, y, cw, 210, 1, ui.dy);
    // número en círculo naranja
    ctx.beginPath(); ctx.arc(cx0+110, y+105+ui.dy, 62, 0, Math.PI*2);
    ctx.fillStyle = N; ctx.fill();
    txt(p[0], cx0+110, y+105+ui.dy, 60, {w:'900', col:'#fff'});
    txt(p[1], cx0+215, y+80+ui.dy, 48, {w:'900', align:'left'});
    txt(p[2], cx0+215, y+140+ui.dy, 33, {col:M, align:'left'});
    ctx.restore();
  });
  txt('Así de simple. Sin trampas.', W/2, 1480+up(tl,3.4).dy, 38, {col:M, a:up(tl,3.4).a});
}

const QUE = [
  'Entreno personalizado con vídeos',
  'Dieta: 5 comidas × 5 opciones',
  'Lista de la compra automática',
  'Se adapta a ti cada semana',
];
function s4(tl){ // QUÉ ES K-ONE
  const p = pop(tl, 0);
  logoK(W/2, 480, 92, p.a, p.s);
  rich([{t:'¿Y qué es ',c:B},{t:'K-ONE',c:N},{t:'?',c:B}], W/2, 620, 56, '900', up(tl,0.35).a, up(tl,0.35).dy);
  txt('Tu preparador de élite, 24/7', W/2, 695+up(tl,0.5).dy, 38, {col:M, a:up(tl,0.5).a});
  const cx0=110, cw=W-220;
  QUE.forEach((q,i)=>{
    const ui = up(tl, 0.7+i*0.28, 0.45);
    const y = 800+i*140;
    card(cx0, y, cw, 118, ui.a, ui.dy);
    ctx.save(); ctx.globalAlpha = ui.a;
    txt('✓', cx0+52, y+59+ui.dy, 42, {col:V, w:'900', align:'left'});
    txt(q, cx0+125, y+59+ui.dy, 37, {col:'#e6e3de', w:'600', align:'left'});
    ctx.restore();
  });
  txt('Lo que un entrenador de 60€/mes… por 1,99€ el primer mes', W/2, 1450+up(tl,2).dy, 34, {col:M, a:up(tl,2).a});
}

function s5(tl){ // EL PREMIO + confeti
  confeti(tl, clamp(tl/0.5,0,1)*0.85);
  txt('EL PREMIO', W/2, 560+up(tl,0).dy, 34, {col:N, w:'700', mono:true, ls:8, a:up(tl,0).a});
  const p = pop(tl, 0.3, 0.55);
  ctx.save(); ctx.globalAlpha = p.a;
  ctx.translate(W/2, 850); ctx.scale(p.s, p.s);
  ctx.shadowColor='rgba(232,73,15,.6)'; ctx.shadowBlur=80;
  txt('1 MES', 0, -60, 170, {col:N, w:'900'});
  txt('GRATIS', 0, 90, 170, {col:'#fff', w:'900'});
  ctx.restore();
  txt('Plan completo: entreno + dieta + lista de la compra', W/2, 1120+up(tl,0.9).dy, 38, {col:M, w:'600', a:up(tl,0.9).a});
  rich([{t:'(valorado en ',c:M},{t:'19,99€',c:N},{t:')',c:M}], W/2, 1190, 38, '700', up(tl,1.1).a, up(tl,1.1).dy);
}

function s6(tl){ // REGLAS / URGENCIA
  const p = pop(tl, 0.1);
  ctx.save(); ctx.translate(W/2, 700); ctx.scale(p.s, p.s);
  rich([{t:'⏱ Solo valen comentarios',c:B}], 0, -50, 62, '900', p.a);
  rich([{t:'ANTES del pitido inicial',c:N}], 0, 40, 62, '900', p.a);
  ctx.restore();
  const u = up(tl, 0.8);
  card(140, 900+u.dy, W-280, 250, u.a);
  ctx.save(); ctx.globalAlpha = u.a;
  txt('✓ Resultado exacto (ej: 2-1)', W/2, 970+u.dy, 37, {col:'#e6e3de', w:'600'});
  txt('✓ Siguiéndome (para avisarte)', W/2, 1035+u.dy, 37, {col:'#e6e3de', w:'600'});
  txt('✓ Un comentario por persona', W/2, 1100+u.dy, 37, {col:'#e6e3de', w:'600'});
  ctx.restore();
  txt('Si aciertas, te escribo por privado 📩', W/2, 1270+up(tl,1.5).dy, 40, {col:M, w:'600', a:up(tl,1.5).a});
}

const BURBUJAS = [
  ['2-1', 0.0, 200], ['1-1', 0.5, 640], ['0-2', 0.9, 420], ['3-1', 1.3, 760], ['1-0', 1.7, 300],
];
function s7(tl){ // CTA FINAL con burbujas
  // burbujas de comentarios subiendo
  BURBUJAS.forEach(([sc, d, bx])=>{
    const k = clamp((tl-d)/2.4, 0, 1);
    if (k<=0 || k>=1) return;
    const y = 1750 - k*1300;
    const a = k<0.15 ? k/0.15 : (k>0.8 ? (1-k)/0.2 : 1);
    ctx.save(); ctx.globalAlpha = a*0.9;
    setFont(34,'700',true);
    const w2 = ctx.measureText(sc).width + 90;
    rrect(bx, y, w2, 84, 42);
    ctx.fillStyle = COL.carbon; ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth=2; ctx.stroke();
    txt('💬 '+sc, bx+w2/2, y+43, 32, {mono:true, col:'#e6e3de'});
    ctx.restore();
  });
  const p = pop(tl, 0.15);
  ctx.save(); ctx.translate(W/2, 720); ctx.scale(p.s, p.s);
  rich([{t:'SÍGUEME',c:N}], 0, -55, 96, '900', p.a);
  rich([{t:'y deja tu resultado',c:B}], 0, 45, 68, '900', p.a);
  ctx.restore();
  const u = up(tl, 0.8);
  txt('👇 en los comentarios 👇', W/2, 900+u.dy, 48, {w:'700', a:u.a});
  logoK(W/2, 1120+up(tl,1.2).dy, 80, up(tl,1.2).a, 1);
  rich([{t:'k-one',c:'#fff'},{t:'.fit',c:N},{t:' · tu preparador digital',c:M}], W/2, 1230, 36, '700', up(tl,1.5).a, up(tl,1.5).dy);
  txt('¡Suerte! 🍀', W/2, 1360+up(tl,1.8).dy, 44, {col:M, a:up(tl,1.8).a});
}

/* ---------- draw ---------- */
function draw(t){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha = 1; ctx.letterSpacing='0px'; ctx.shadowBlur=0;
  ctx.fillStyle = COL.negro; ctx.fillRect(0,0,W,H);

  let key='s1', start=0;
  for (const [k,v] of Object.entries(T)) if (t>=v){ key=k; start=v; }
  const tl = t - start;
  ctx.globalAlpha = clamp(tl/0.3, 0, 1);
  ({s1,s2,s3,s4,s5,s6,s7})[key](tl);
  ctx.globalAlpha = 1;
  ctx.fillStyle = N;
  ctx.fillRect(0, 0, W*(t/TOTAL), 7);
}

/* ---------- reproducción / grabación ---------- */
const status = document.getElementById('status');
const btnGen = document.getElementById('gen');
const btnPrev = document.getElementById('prev');
let running = false;

function play(record){
  if (running) return; running = true;
  btnGen.disabled = true; btnPrev.disabled = true;
  window.__videoDone = 0;

  let rec = null, chunks = [], mime = '', ext = '';
  if (record){
    const tipos = [
      ['video/mp4;codecs=avc1.640028','mp4'],
      ['video/mp4','mp4'],
      ['video/webm;codecs=vp9','webm'],
      ['video/webm','webm'],
    ];
    for (const [m,e] of tipos) if (MediaRecorder.isTypeSupported(m)) { mime=m; ext=e; break; }
    if (!mime){ status.textContent = 'Tu navegador no soporta grabación. Usa Chrome actualizado.'; running=false; btnGen.disabled=btnPrev.disabled=false; return; }
    const stream = cv.captureStream(30);
    rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 14_000_000 });
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `k-one-sorteo-fra-esp.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      window.__videoDone = blob.size;
      const mb = (blob.size/1048576).toFixed(1);
      status.innerHTML = `✅ Vídeo descargado: <a class="dl" href="${url}" download="k-one-sorteo-fra-esp.${ext}">k-one-sorteo-fra-esp.${ext}</a> (${mb} MB, ${ext.toUpperCase()}).`;
    };
    rec.start(250);
    status.textContent = `⏺ Grabando (${ext.toUpperCase()})… no cambies de pestaña durante 28 s.`;
  } else {
    status.textContent = '▶ Reproduciendo (sin grabar)…';
  }

  const t0 = performance.now();
  function loop(){
    const t = (performance.now()-t0)/1000;
    draw(Math.min(t, TOTAL));
    if (t < TOTAL + 0.3){ requestAnimationFrame(loop); }
    else {
      if (rec) rec.stop();
      else status.textContent = 'Listo. Pulsa 🎬 para generar el archivo.';
      running = false; btnGen.disabled = btnPrev.disabled = false;
    }
  }
  requestAnimationFrame(loop);
}

btnGen.addEventListener('click', () => play(true));
btnPrev.addEventListener('click', () => play(false));
draw(0.001);
</script>
</body>
</html>

<!DOCTYPE html>
<!--
  Imagen para compartir (og-image-v2.jpg, 1200x630): la que sale en WhatsApp,
  Instagram, Google... al pegar k-one.fit. Rehecha el 3 oct 2026 con la
  estética de la web (Bebas/DM Mono/Inter, oscuro con brasa) y la oferta
  actual (primer mes gratis, sin tarjeta); la anterior era de junio y esta
  página aún decía "desde 1,99 €/mes".
  Captura (servidor local en :8080):
    node marketing/cdp-shot.mjs http://localhost:8080/og-generator.html og-image-v2.png 1200 630 1  (y después a JPG: ffmpeg -i og-image-v2.png -q:v 3 og-image-v2.jpg)
  La pantalla del móvil es marketing/carteles/app-hoy-og.png (cliente de demo).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>K-ONE · imagen para compartir</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0A0A0A; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #F0EDE8; font-family: 'Inter', sans-serif; background: #0A0A0A; }
  .og::before { content: ''; position: absolute; width: 900px; height: 900px; right: -260px; top: -380px; border-radius: 50%; background: radial-gradient(circle, rgba(209,66,14,.42), transparent 62%); }
  .og::after { content: ''; position: absolute; width: 700px; height: 700px; left: -330px; bottom: -420px; border-radius: 50%; background: radial-gradient(circle, rgba(209,66,14,.20), transparent 62%); }
  .rejilla { position: absolute; inset: 0; opacity: .06; background-image: linear-gradient(rgba(255,255,255,.7) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.7) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: linear-gradient(90deg, #000, transparent 70%); mask-image: linear-gradient(90deg, #000, transparent 70%); }
  .txt { position: absolute; left: 72px; top: 64px; width: 640px; z-index: 2; }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 54px; letter-spacing: 3px; line-height: 1; }
  .logo span, .na { color: #F26A36; }
  .pill { display: inline-flex; align-items: center; gap: 10px; margin-top: 44px; font-family: 'DM Mono', monospace; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; color: #F26A36; background: rgba(209,66,14,.12); border: 1.5px solid rgba(242,106,54,.5); border-radius: 999px; padding: 8px 18px; }
  .pill::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #F26A36; box-shadow: 0 0 10px #F26A36; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 104px; line-height: .9; letter-spacing: 1px; margin-top: 20px; }
  .sub { font-size: 23px; line-height: 1.45; color: rgba(240,237,232,.78); margin-top: 22px; max-width: 540px; }
  .pie { position: absolute; left: 72px; bottom: 52px; z-index: 2; font-family: 'DM Mono', monospace; font-size: 17px; letter-spacing: 4px; text-transform: uppercase; color: rgba(240,237,232,.7); }
  .pie b { color: #F26A36; font-weight: 500; }
  .movil { position: absolute; right: 86px; top: 58px; width: 318px; height: 690px; border-radius: 46px; border: 11px solid #161616; box-shadow: 0 0 0 2px #2c2c2c, 0 40px 90px rgba(0,0,0,.75), 0 0 70px rgba(209,66,14,.22); overflow: hidden; transform: rotate(4deg); z-index: 1; background: #0A0A0A url('marketing/carteles/app-hoy-og.png') top center / 100% auto no-repeat; }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="rejilla"></div>
  <div class="txt">
    <div class="logo">K-<span>ONE</span></div>
    <div class="pill">Primer mes gratis · sin tarjeta</div>
    <h1>Entreno y dieta,<br><span class="na">hechos para ti</span></h1>
    <p class="sub">Un plan personalizado que se ajusta cada semana a cómo te va.</p>
  </div>
  <div class="pie">k-one.fit · <b>entrenamiento + nutrición</b></div>
  <div class="movil" role="img" aria-label="La pantalla Hoy de la app K-ONE"></div>
</div>
<script>
  window.listo = document.fonts.ready;
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="#141414" opacity="0.4"/>

  <!-- Barbell motif -->
  <g stroke="#E8490F" stroke-width="6" fill="none" opacity="0.9">
    <line x1="120" y1="300" x2="1080" y2="300" stroke="#8A8A8A" stroke-width="8"/>
    <rect x="60" y="240" width="50" height="120" rx="6"/>
    <rect x="130" y="200" width="60" height="200" rx="6"/>
    <rect x="1090" y="240" width="50" height="120" rx="6"/>
    <rect x="1010" y="200" width="60" height="200" rx="6"/>
    <circle cx="600" cy="300" r="8" fill="#E8490F"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" letter-spacing="6" fill="#F0EDE8" text-anchor="middle">K-<tspan fill="#E8490F">ONE</tspan></text>

  <!-- Tagline -->
  <text x="600" y="490" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="32" letter-spacing="2" fill="#B5B2AD" text-anchor="middle">NO HAY ATAJOS. HAY PASOS.</text>
</svg>
